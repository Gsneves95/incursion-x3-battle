name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar o Chromium (para a matriz de enquadramento)
        run: npx playwright install --with-deps chromium
      - name: Rodar as suítes (inclui a matriz de enquadramento em navegador real)
        run: npm test
