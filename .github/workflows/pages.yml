name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar o build (arquivo único) + assets do modo app
        run: |
          node tools/build.js
          mkdir -p site
          cp dist/incursion.html site/index.html
          # TODOS os assets REAIS de web/ ao lado do index: manifest + ícones do modo app
          # (PWA instalável; blob: não instala), artes de habilidade (web/skills, F1.7) e
          # os banners da home (web/banners, §208). Recursivo DE PROPÓSITO: o hand-pick
          # asset-a-asset foi o que deixou os banners fora do publicado (§209) enquanto o
          # dist local — que copia web/ inteiro — os tinha. Um asset novo em web/ agora
          # deploia sozinho, sem editar este passo.
          cp -r web/. site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
