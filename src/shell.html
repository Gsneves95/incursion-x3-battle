.cmaescab{padding:8px 24px 2px;font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--ink-dim)}
.cmaescab b{color:var(--gold-text);font-variant-numeric:tabular-nums}
.csec__maes{margin-left:auto;font-weight:700;font-size:11px;letter-spacing:.03em;color:var(--ink-mute)}
.csec__maes.meia{color:var(--e-Verdejante)}
.ctile__m{position:absolute;left:5px;bottom:24px;min-width:15px;height:15px;padding:0 3px;display:grid;place-items:center;
  font-family:'Cinzel',serif;font-weight:900;font-size:9px;line-height:1;color:#201604;background:#8d84ad;border-radius:8px}
.ctile__m.m--1{background:#8d84ad} .ctile__m.m--2{background:#7fb0e0} .ctile__m.m--3{background:#b06cff;color:#fff} .ctile__m.m--4{background:var(--gold-text)}
/* ======================= §350 — FICHA DO DEUS e NÍVEIS (telas fixas 1846×852) ======================= */
/* ===================== §358 — FICHA e NÍVEIS: canvas 780×360 (= o celular), px reais ≥ §357, SEM rolagem ===================== */
.stage.deusfix2,.stage.nlfix2{border:0;border-radius:0;box-shadow:none;background:#03050B}
#baselayer.deusfix2,#baselayer.nlfix2{position:absolute;inset:0;background:#03050B;overflow:hidden}
#deusfix,#nlfix{position:absolute;left:50%;top:50%;width:780px;height:360px;transform-origin:center;overflow:hidden;color:#E8ECF4;font-family:'Rajdhani',system-ui,sans-serif;font-weight:600}
#deusfix{background:radial-gradient(120% 90% at 72% 0%,#141026,#0a0817 60%,#05040e)}
#nlfix{background:radial-gradient(130% 90% at 50% 0%,#141026 0%,#0a0817 55%,#05040e)}
#deusfix .cin,#nlfix .cin{font-family:'Cinzel',serif}
#deusfix .dsxb,#nlfix .dsxb{border:0;border-radius:9px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.03em;display:inline-flex;align-items:center;justify-content:center;line-height:1.1}
#deusfix .rar--SS,#nlfix .rar--SS{color:#0e0a1a;background:linear-gradient(180deg,#ffe9ad,#E9C25A);border-color:#F0D79A}
#deusfix .rar--S,#nlfix .rar--S{color:#F0D79A}
#deusfix .rar--A,#nlfix .rar--A{color:#b48ce0}
/* ---- FICHA ---- */
#deusfix .dsx-art{position:absolute;left:0;top:0;width:296px;height:360px;overflow:hidden;background:#0A0E1C}
#deusfix .dsx-art__mono{position:absolute;inset:0;display:grid;place-items:center}
#deusfix .dsx-art__mono .slot{width:120px;height:120px;opacity:.5}
#deusfix .dsx-art__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 16%}
#deusfix.deusfix--falta .dsx-art__img,#deusfix.deusfix--falta .dsx-art__mono{filter:grayscale(1) brightness(.5)}
#deusfix .dsx-art__veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,14,0) 40%,rgba(5,4,14,.42) 64%,#05040e 100%),linear-gradient(90deg,rgba(5,4,14,0) 74%,rgba(5,4,14,.5))}
#deusfix .dsxb--voltar{position:absolute;top:8px;left:8px;z-index:3;height:40px;padding:0 14px;font-size:14px;color:#E6EAF2;background:rgba(8,10,18,.82);box-shadow:inset 0 0 0 1px rgba(154,164,184,.42)}
#deusfix .dsx-art__tag{position:absolute;left:14px;top:54px;z-index:2;font-weight:800;font-size:14px;letter-spacing:.06em;color:#E0545B;background:rgba(10,8,20,.78);padding:5px 12px;border-radius:8px}
#deusfix .dsx-art__id{position:absolute;left:16px;right:12px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:3px}
#deusfix .dsx-art__nome{font-size:34px;font-weight:900;color:#F0D79A;letter-spacing:.01em;line-height:.96;text-shadow:0 3px 14px rgba(0,0,0,.85);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#deusfix .dsx-art__posse{font-weight:800;font-size:13px;letter-spacing:.02em}
#deusfix .dsx-art__posse--tem{color:#58D68D} #deusfix .dsx-art__posse--nao{color:#9AA4B8}
#deusfix .dsx-art__arq{font-size:13px;font-style:italic;color:#C6B894;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#deusfix .dsx-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:104px;z-index:4;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(8,10,18,.55);border:0;color:#F0D79A;border-radius:8px}
#deusfix .dsx-nav--prev{left:2px} #deusfix .dsx-nav--next{right:2px}
#deusfix .dsx-nav:disabled{opacity:.25;cursor:default}
#deusfix .dsx-nav i{width:12px;height:12px;border-top:2px solid currentColor;border-right:2px solid currentColor;display:block}
#deusfix .dsx-nav--prev i{transform:rotate(-135deg);margin-left:4px} #deusfix .dsx-nav--next i{transform:rotate(45deg);margin-right:4px}
#deusfix .dsx-col{position:absolute;left:304px;right:46px;top:0;bottom:0;display:flex;flex-direction:column;gap:4px;padding:6px 0 8px}
#deusfix .dsx-cab{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:40px}
#deusfix .dsx-rar{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:9px;font-family:'Cinzel',serif;font-weight:900;font-size:15px;border:2px solid currentColor}
#deusfix .dsxb--subir{margin-left:auto;position:relative;height:40px;padding:0 16px;font-size:14px;letter-spacing:.03em;color:#8893a8;background:rgba(18,22,36,.9);box-shadow:inset 0 0 0 1px rgba(154,164,184,.4)}
#deusfix .dsxb--subir.is-pag{color:#1a1530;background:var(--ouro-grad);box-shadow:none}
#deusfix .dsx-dot{width:7px;height:7px;border-radius:50%;background:#E0545B;margin-left:7px}
#deusfix .dsx-tags{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px}
#deusfix .dsx-tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:9px;font-size:13px;color:#E8ECF4;background:rgba(14,18,32,.8);box-shadow:inset 0 0 0 1px rgba(201,164,76,.3)}
#deusfix .dsx-tag__ic{width:15px;height:15px;color:#C9A44C;display:inline-flex}
#deusfix .dsx-tag .orbe{flex:none}
#deusfix .dsx-posse{flex:0 0 auto;font-weight:800;font-size:13px;letter-spacing:.02em}
#deusfix .dsx-posse--tem{color:#58D68D} #deusfix .dsx-posse--nao{color:#9AA4B8}
#deusfix .dmaes{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:11px;background:rgba(14,18,32,.72);box-shadow:inset 0 0 0 1px rgba(201,164,76,.3)}
#deusfix .dcomo{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:4px 9px 5px;border-radius:11px;background:rgba(14,18,32,.72);box-shadow:inset 0 0 0 1px rgba(201,164,76,.3)}
#deusfix .dmaes__top{display:flex;align-items:baseline;gap:8px;flex:0 0 auto}
#deusfix .dmaes__hint{display:none}
#deusfix .dmaes__rot,#deusfix .dcomo__rot{font-family:'Cinzel',serif;font-weight:800;font-size:13px;letter-spacing:.09em;color:#F0D79A}

#deusfix .dmaes__nv{font-size:13px;color:#E8ECF4;white-space:nowrap;flex:0 0 auto}
#deusfix .dmaes__nv b{color:#F0D79A}
#deusfix .dmaes__rail{position:relative;flex:1 1 auto;height:7px;border-radius:999px;background:rgba(255,255,255,.12);margin:0}
#deusfix .dmaes__fill{position:absolute;left:0;top:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#C9962F,#F0D79A)}
#deusfix .dmaes__mk{position:absolute;top:50%;transform:translateX(-50%)}
#deusfix .dmaes__mk i{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#2a3350;box-shadow:0 0 0 3px #0a0817}
#deusfix .dmaes__mk em{display:none}

/* ===================== F3.6 — Desafios de composição (entrada + validação de time ao vivo) ===================== */
.pdesafios{display:flex;align-items:center;justify-content:space-between;width:100%;cursor:pointer;
  padding:11px 15px;margin:0 0 14px;font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.06em;
  color:var(--ink);background:rgba(20,16,38,.55);border:1px solid var(--gold-soft);border-radius:11px;
  transition:border-color .12s,transform .08s}
.pdesafios:active{transform:translateY(1px) scale(.995);border-color:var(--gold-text)}
.pdesafios__go{font-family:'Cinzel',serif;font-weight:900;font-size:18px;color:var(--gold-text)}
.cenc__feitosel{color:var(--e-Verdejante)}
.cmontarpe .cval{font-weight:700;font-size:12px;letter-spacing:.03em;margin-right:auto}
.cmontarpe .cval.ok{color:var(--e-Verdejante)}
.cmontarpe .cval.nao{color:var(--e-Chama)}
.cmontarpe{gap:14px}

/* ===== MISSÕES (F6/§234) — o mapa da coleção: 4 seções, contador ao vivo, motivo visível ===== */
.msec{margin:0 0 18px}
.msec__cab{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.msec__cab h2{font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text);margin:0}
.msec__cab--cat h2{color:var(--ink-dim)}
.msec__n{font-weight:700;font-size:12px;color:var(--ink-mute)}
.msec__vazio{font-weight:600;font-size:12.5px;color:var(--ink-mute);line-height:1.45;margin:0;padding:6px 10px;border:1px dashed #2c2648;border-radius:8px}
/* ===================== §316 — TELA DE PROVAÇÕES (paisagem: painel fixo à esq + lista rolável à dir) ===================== */
.tela--prov{--pv-line:rgba(216,178,90,.22)}
/* BARRA SUPERIOR fina: ‹ Início · PROVAÇÕES · ranque */
.pv__top{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:7px 18px;border-bottom:1px solid var(--pv-line);
  background:linear-gradient(180deg,rgba(12,10,26,.85),rgba(12,10,26,0))}
.pv__back{flex:0 0 auto;background:transparent;border:0;color:var(--ink-dim);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;cursor:pointer;padding:6px 8px;min-height:36px}
.pv__titulo{flex:1 1 auto;text-align:center;font-family:'Cinzel',serif;font-weight:900;font-size:20px;letter-spacing:.14em;color:var(--gold-text);margin:0}
.pv__rq{flex:0 0 auto;display:flex;justify-content:flex-end;min-width:184px}
.rq{display:flex;align-items:center;gap:8px;color:var(--gold)}
.rq__helm{width:26px;height:26px;flex:0 0 auto;color:var(--gold)}
.rq__id{display:flex;flex-direction:column;gap:2px;min-width:132px}
.rq__f{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--gold-text);line-height:1}
.rq__bar{width:150px;height:4px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12)}
.rq__bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-text))}
.rq__t{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:10px;color:var(--ink-mute);line-height:1}
.rq__max{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#C9A44C}
/* CORPO — duas colunas: esquerda FIXA (painel), direita ROLA (lista) */
.pv__corpo{flex:1 1 auto;min-height:0;display:flex;gap:14px;padding:12px 18px 14px}
.pv__esq{flex:0 0 48%;max-width:48%;min-height:0;display:flex}
.pv__dir{flex:1 1 auto;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:6px}
.pv__dir::-webkit-scrollbar{width:6px}
.pv__dir::-webkit-scrollbar-thumb{background:var(--gold-soft);border-radius:999px}
.pv__dir::-webkit-scrollbar-track{background:transparent}
.pv__off{padding:10px 24px 20px}

/* PAINEL PROVAÇÃO ATIVA — o ÚNICO com moldura dourada acesa + brilho */
.pa{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;border:1.5px solid var(--gold);border-radius:14px;
  background:linear-gradient(180deg,rgba(40,32,16,.5),rgba(16,13,32,.6));box-shadow:0 0 0 1px rgba(255,217,122,.14),0 0 22px rgba(216,178,90,.26);padding:9px 14px}
.pa__rot{flex:0 0 auto;font-family:'Cinzel',serif;font-weight:900;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-text);margin:0 0 6px}
.pa__head{flex:0 0 auto;display:flex;gap:12px;align-items:flex-start}
.pa__med{flex:0 0 auto;width:92px;height:92px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 12px rgba(216,178,90,.35);background:#14112a}
.pa__med .slot{width:100%;height:100%}
.pa__id{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.pa__nome{display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-weight:900;font-size:21px;letter-spacing:.02em;color:var(--gold-text);line-height:1.05;white-space:nowrap;overflow:hidden}
.pa__sub{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.03em;color:var(--ink-mute)}
.pa__div{height:1px;background:var(--pv-line);margin:5px 0}
.pa__motivo{font-style:italic;font-weight:500;font-size:12px;line-height:1.32;color:var(--ink-dim);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pa__objs{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;margin:8px 0 6px;overflow:hidden}
.pa__foot{flex:0 0 auto;display:flex;align-items:center;gap:12px;border-top:1px solid var(--pv-line);padding-top:8px}
.pa__foot .b{min-height:44px}
.pa__footdiv{width:1px;height:16px;background:var(--pv-line)}
.pa__slot{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--ink-mute)}
.pa--vazio .pa__vazio{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.pa__med--off{border-color:#4a4570;box-shadow:none;filter:grayscale(1) brightness(.6);display:grid;place-items:center;color:#4a4570}
.pa__vaziomsg{font-weight:600;font-size:13px;line-height:1.5;color:var(--ink-dim);max-width:240px}
.pa__vaziomsg b{color:var(--gold-text)}

/* LINHA DE OBJETIVO (painel + expansão mini): ícone · texto · widget de progresso */

.ob--mini{gap:7px}
.obic{width:16px;height:16px;flex:0 0 auto;color:var(--gold-soft)}

.ob__t{flex:1 1 auto;min-width:0;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;line-height:1.25;color:var(--ink-dim)}
.ob--mini .ob__t{font-size:11px}
.ob__t b{color:var(--gold-text);font-weight:700}
.ob__t .lk{color:var(--ink-mute);opacity:.75}
.ob__p{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.ob__meta{flex:0 0 auto;font-family:'Cinzel',serif;font-weight:800;font-size:13px;color:var(--gold-text)}
.ob__ok{color:var(--gold-text);font-weight:900;font-size:14px}
.xy{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;color:var(--ink-mute);min-width:26px;text-align:right}
.dots{display:inline-flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:transparent;border:1px solid var(--gold-soft)}
.dot.on{background:var(--gold-text);border-color:var(--gold-text);box-shadow:0 0 4px rgba(255,217,122,.5)}
.dupla{display:inline-flex;flex-direction:column;gap:2px}
.embs{display:inline-flex;gap:3px}
.emb{width:8px;height:8px;transform:rotate(45deg);background:transparent;border:1px solid var(--gold-soft)}
.emb.on{background:var(--gold-text);border-color:var(--gold-text)}
.obar{width:66px;height:5px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.14)}
.obar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-text))}

/* SELO de raridade: A roxo · S dourado · SS mais nobre (sem virar brilho) */
.selo{flex:0 0 auto;display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;font-family:'Cinzel',serif;font-weight:900;font-size:10px;line-height:1;border:1px solid currentColor;vertical-align:middle}
.selo--A{color:#b48ce0}
.selo--S{color:var(--gold-text)}
.selo--SS{color:#0e0a1a;background:linear-gradient(180deg,#ffe9ad,var(--gold));border-color:var(--gold-text)}

/* LISTA — plana, sem moldura por linha, sem brilho */
.fx{display:flex;align-items:center;gap:8px;margin:12px 2px 5px}
.fx:first-child{margin-top:2px}
.fx__n{flex:0 0 auto;font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim)}
.fx__ln{flex:1 1 auto;height:1px;background:var(--pv-line)}
.fx--fechada{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:0;border-top:1px solid var(--pv-line);cursor:pointer;padding:9px 2px;color:var(--ink-mute);text-align:left;min-height:42px}
.fx--fechada .fx__n{color:var(--ink-mute)}
.fx__falta{flex:1 1 auto;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:11px;color:var(--ink-mute)}
.fx__seta{flex:0 0 auto;color:var(--ink-mute);font-size:13px;transition:transform .15s}
.fx__seta.is-open{transform:rotate(180deg)}
.lr{border-bottom:1px solid rgba(216,178,90,.1)}
.lr__row{display:flex;align-items:center;min-height:52px}
.lr__tap{flex:1 1 auto;min-width:0;overflow:hidden;display:flex;align-items:center;gap:10px;background:transparent;border:0;color:inherit;cursor:default;text-align:left;padding:6px 2px;min-height:52px}
.lr__tap[data-linha]{cursor:pointer}
.lr--ativa{box-shadow:inset 3px 0 0 var(--gold-text)}
.lr--ativa .lr__row{padding-left:6px}
.lr__art{flex:0 0 auto}
.med{display:block;width:38px;height:38px;border-radius:50%;overflow:hidden;border:1px solid var(--gold-soft);background:#14112a}
.med .slot{width:100%;height:100%}
.med--trava{filter:grayscale(1) brightness(.62);border-color:#3a3358}
.lr__nome{flex:0 1 auto;min-width:0;font-family:'Cinzel',serif;font-weight:700;font-size:14.5px;letter-spacing:.02em;color:var(--gold-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr--travada .lr__nome{color:var(--ink-mute)}
.lr__st{flex:1 1 auto;text-align:right;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11.5px;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr--ativa .lr__st{color:var(--gold-text)}
.lr__cad{opacity:.72}
.lr__seta{flex:0 0 auto;color:var(--ink-mute);font-size:13px;transition:transform .15s;width:16px;text-align:center}
.lr__seta.is-open{transform:rotate(180deg)}
.lr__acao{flex:0 0 auto;margin-left:10px}
.lr__acao .b{min-height:44px}
.lr__conf{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:11.5px;color:var(--ink-dim);padding:2px 2px 9px 48px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lr__conf b{color:var(--gold-text)}
.lr__confb{display:inline-flex;gap:8px;margin-left:auto}
.lr__confb .b{min-height:44px}
.lr__exp{padding:2px 2px 10px 48px}
.exp__motivo{font-style:italic;font-weight:500;font-size:11.5px;line-height:1.35;color:var(--ink-mute);margin:0 0 6px}
.exp__objs{display:flex;flex-direction:column;gap:4px}
.exp__nota{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:11px;color:#c6b0b0;margin-top:5px}
.exp__nota b{color:#e7bd74;font-weight:800}
.b.pulso{animation:pvpulso .6s ease}
@keyframes pvpulso{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px rgba(255,217,122,.55)}}
/* SEM SERVIDOR: mensagem honesta (não mostra zero) + catálogo das histórias (os 91 motivos para ler) */
.moff{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:0 0 16px;border:1px solid var(--gold-soft);border-radius:10px;background:rgba(255,217,122,.05)}
.moff__ic{font-family:'Cinzel',serif;font-size:34px;color:var(--gold-soft);flex:0 0 auto}
.moff__msg{font-weight:600;font-size:13.5px;line-height:1.5;color:var(--ink-dim);margin:0}
.moff__msg b{color:var(--gold-text)}
.mcatgrid{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mcat{display:flex;align-items:center;gap:10px;width:100%;min-height:76px;padding:6px 12px 6px 6px;cursor:pointer;text-align:left;
  border:1px solid #241f3e;border-radius:9px;background:rgba(16,13,32,.5);color:inherit}
.mcat__art{flex:0 0 44px;height:44px;border-radius:6px;overflow:hidden;background:#14112a;filter:grayscale(1) brightness(.7)}
.mcat__art .slot{width:100%;height:100%}
.mcat__b{display:flex;flex-direction:column;gap:1px;min-width:0}
.mcat__n{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-dim)}
.mcat__f{font-weight:700;font-size:11px;color:var(--ink-mute)}
.mcat__f b{color:#e6b3b3}
.mcat__m{font-style:italic;font-size:10.5px;line-height:1.3;color:var(--ink-mute)}
/* ELO no detalhe do deus (§220): a via MISSÃO é clicável e leva ao mapa; mostra o motivo. */
.dcomo__via--miss{cursor:pointer;text-align:left;background:rgba(255,217,122,.05);border:1px solid var(--gold-soft);border-radius:8px;padding:5px 8px}
.dcomo__motivo{font-style:italic;font-size:9.5px;line-height:1.3;color:var(--ink-mute);margin-top:2px}

/* ===== PvP LOBBY (F5.3/§236): apelido + time de 3 + fila ===== */
.pvpnick{margin:0 0 12px}
.pvpnick label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute)}
.pvpnick input{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--ink);background:#14112a;border:1px solid var(--gold-soft);border-radius:8px;padding:9px 12px;min-height:44px}
.pvpnick--fixo{font-weight:600;font-size:13px;color:var(--ink-dim);letter-spacing:.02em}
.pvpnick--fixo b{color:var(--gold-text);font-family:'Cinzel',serif;letter-spacing:.06em}
.pvpsel__cab{display:flex;align-items:baseline;gap:10px;margin:14px 0 8px}
.pvpsel__cab h2{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text);margin:0}
.pvpslots{display:flex;gap:10px}
.pvps{flex:1 1 0;min-width:0;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;
  border:1px solid var(--gold-soft);border-radius:10px;background:rgba(20,16,38,.55);color:var(--ink);padding:8px 4px}
.pvps--vazio{border-style:dashed;border-color:#3a3358;color:#5f5980;cursor:default}
.pvps--vazio span{font-family:'Cinzel',serif;font-size:28px;font-weight:900;opacity:.5}
.pvps__art{width:48px;height:48px;border-radius:7px;overflow:hidden;background:#14112a}
.pvps__art .slot{width:100%;height:100%}
.pvps__n{font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);text-align:center;line-height:1.05}
.pvpbtns{display:flex;gap:10px;margin:14px 0 4px}
.pvpbtns .b{flex:1 1 0;min-height:48px}
.pvperro{font-weight:700;font-size:12.5px;color:#ff9a9a;margin:8px 0 0}
.pvpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:2px}
.pvpt{position:relative;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;
  border:1px solid #2c2648;border-radius:10px;background:rgba(16,13,32,.5);color:var(--ink-dim);padding:8px 4px}
.pvpt.is-sel{border-color:var(--gold);background:rgba(255,217,122,.08);color:var(--ink)}
.pvpt__art{width:44px;height:44px;border-radius:6px;overflow:hidden;background:#14112a}
.pvpt__art .slot{width:100%;height:100%}
.pvpt__n{font-family:'Cinzel',serif;font-weight:700;font-size:10.5px;letter-spacing:.02em;text-transform:uppercase;text-align:center;line-height:1.05}
.pvpt__ck{position:absolute;top:5px;right:6px;font-size:12px;font-weight:900;color:var(--gold-text)}
.pvpfila__ic{animation:pvppulse 1.4s ease-in-out infinite}
@keyframes pvppulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ===== §328 — ETIQUETAS de efeito legíveis (abaixo da vida, dois lados) + QUADRO DE INSPEÇÃO ===== */
body.embatalha #build, body.embatalha #conta-botao{display:none!important}   /* §328 P3: saem do canto, vão ao menu ⋯ */
body.emdesafios #build, body.emdesafios #conta-botao{display:none!important}  /* §339: idem na tela Desafios (seguem na home/menu) */
body.emmontar #build, body.emmontar #conta-botao{display:none!important}  /* §342: idem no MONTAR TIME do Domínio */
body.emcolecao #build, body.emcolecao #conta-botao{display:none!important}  /* §346b: idem na Coleção (tela cheia; seguem na home/menu) */
body.emdomhub #build, body.emdomhub #conta-botao{display:none!important}  /* §348: idem no HUB do Domínio (tela cheia; seguem na home/menu) */
body.emdominios #build, body.emdominios #conta-botao{display:none!important}  /* §365: idem na SELEÇÃO dos Domínios (canvas 780×360) */
body.emprov #build, body.emprov #conta-botao{display:none!important}  /* §349: idem na tela PROVAÇÕES (tela cheia; seguem na home/menu) */
body.emdeus #build, body.emdeus #conta-botao{display:none!important}  /* §350: idem na FICHA do deus */
body.emniveis #build, body.emniveis #conta-botao{display:none!important}  /* §350: idem nos NÍVEIS */
body.emcompos #build, body.emcompos #conta-botao{display:none!important}  /* §351: idem na lista de Desafios de Composição */
body.emcampanha #build, body.emcampanha #conta-botao{display:none!important}  /* §364: idem na CAMPANHA (tela cheia; cobriam o 1º nó da trilha) */
/* §367: INVOCAÇÃO, HOME (mapa), EM BREVE (Loja) e GUIA no canvas 780×360 — o carimbo 8px e o botão conta saem (o build
   segue no menu ☰ da batalha; a conta, no fluxo de conta). Sem eles, estas telas cumprem o eixo (a) de ≥12px. */
body.eminvocacao #build, body.eminvocacao #conta-botao,
body.emhomefix #build, body.emhomefix #conta-botao,
body.emembreve #build, body.emembreve #conta-botao,
body.emguia #build, body.emguia #conta-botao{display:none!important}
/* §367 — molduras das telas no canvas 780×360 (fundo da sobra = canvas escura, sem borda/arredondado) */
.stage.inv2,.stage.home2,.stage.embreve2{border:0;border-radius:0;box-shadow:none;background:#03050B}
#baselayer.inv2,#baselayer.home2,#baselayer.embreve2{position:absolute;inset:0;background:#03050B;overflow:hidden}
/* §367 — HOME (o MAPA) no canvas 780×360: a caixa PREENCHE o canvas; a arte continua (cover) */
#homefix{position:absolute;left:50%;top:50%;width:780px;height:360px;transform-origin:center;overflow:hidden;background:#05040e}
#homefix .mapa{position:absolute;inset:0}
#homefix .mapa__caixa{left:0;top:0;width:780px;height:360px;transform:none}
#homefix .ilha__cont,#homefix .ilha__campnum,#homefix .ilha__breveTag{font-size:12px}
#homefix .mperfil__faixa{font-size:12px}
/* §351 — LISTA DE DESAFIOS DE COMPOSIÇÃO (tela fixa 1846×852, visual §339) */
/* §360: COMPOSIÇÃO no canvas 780×360 (px de design = px real) */
.stage.cmp2{border:0;border-radius:0;box-shadow:none;background:#03050B}
#baselayer.cmp2{position:absolute;inset:0;background:#03050B;overflow:hidden}
#compfix{position:absolute;left:50%;top:50%;width:780px;height:360px;transform-origin:center;overflow:hidden;
  background:radial-gradient(130% 90% at 50% 0%,#0e1424 0%,#070a14 60%,#05070e 100%);color:#E8ECF4;font-family:'Rajdhani',system-ui,sans-serif;font-weight:600}
#compfix .cin{font-family:'Cinzel',serif}
#compfix .cmpb{border:0;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.02em;height:40px;font-size:13px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;line-height:1.05;color:#E8ECF4;background:rgba(14,18,32,.85);box-shadow:inset 0 0 0 1px rgba(201,164,76,.45)}
#compfix .cmpb--voltar{letter-spacing:.04em;padding:0 12px}
#compfix .cmpb--primary{color:#2A1A04;background:linear-gradient(180deg,#FBE29A,#E9C25A 45%,#C9962F);box-shadow:inset 0 1px 0 rgba(255,250,225,.6),0 2px 6px rgba(0,0,0,.5);font-size:13px}
#compfix .cmpb--quiet{background:rgba(10,13,22,.7);box-shadow:inset 0 0 0 1px rgba(154,164,184,.4);color:#C9CED8}
#compfix .cmp-cab{position:absolute;left:8px;right:8px;top:6px;height:40px;display:flex;align-items:center;gap:10px}
#compfix .cmp-titulo{font-size:16px;font-weight:900;letter-spacing:.02em;color:#F0D79A;margin:0;text-shadow:0 1px 5px rgba(0,0,0,.6);white-space:nowrap}
#compfix .cmp-prog{margin-left:auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end;width:180px;flex:none}
#compfix .cmp-prog__n{font-size:12px;color:#C9CED8;white-space:nowrap}
#compfix .cmp-prog__bar{width:100%;height:7px;border-radius:4px;background:#1a1f30;overflow:hidden}
#compfix .cmp-prog__bar i{display:block;height:100%;background:linear-gradient(90deg,#C9962F,#F0D79A)}
#compfix .cmp-intro{position:absolute;left:8px;right:8px;top:48px;margin:0;font-size:12px;color:#9AA4B8;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#compfix .cmp-grade{position:absolute;left:8px;right:8px;top:68px;bottom:6px;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start;padding-right:3px}
#compfix .cmp-card{position:relative;box-sizing:border-box;min-height:160px;display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:10px;background:rgba(12,16,30,.85);box-shadow:inset 0 0 0 1px rgba(201,164,76,.3)}
#compfix .cmp-card--feito{box-shadow:inset 0 0 0 1.5px rgba(240,180,60,.8),0 0 12px rgba(240,180,60,.12)}
#compfix .cmp-card__selo{position:absolute;top:7px;right:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#2A1A04;background:linear-gradient(180deg,#FBE29A,#E9C25A);box-shadow:0 1px 4px rgba(0,0,0,.5)}
#compfix .cmp-card__top{display:flex;align-items:center;gap:8px;padding-right:26px}
#compfix .cmp-card__ic{width:36px;height:36px;flex:none;border-radius:8px;display:grid;place-items:center;background:rgba(201,164,76,.1);box-shadow:inset 0 0 0 1px rgba(201,164,76,.35)}
#compfix .cmp-card__ic svg{width:24px;height:24px}
#compfix .cmp-card__id{display:flex;flex-direction:column;gap:1px;min-width:0}
#compfix .cmp-card__n{font-size:15px;font-weight:900;color:#F0D79A;letter-spacing:.01em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#compfix .cmp-card__regra{font-size:12px;color:#D5DAE4;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#compfix .cmp-card__foes{display:flex;align-items:center;gap:7px}
#compfix .cmp-card__foeslab{font-size:12px;color:#9AA4B8;letter-spacing:.03em;flex:none}
#compfix .cmp-foes{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden}
#compfix .cmp-foe{display:flex;flex-direction:column;align-items:center;gap:1px;width:42px}
#compfix .cmp-foe__p{width:30px;height:30px;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
#compfix .cmp-foe__p .slot{width:100%;height:100%}#compfix .cmp-foe__p .slot>img{object-fit:cover}
#compfix .cmp-foe__n{font-size:12px;color:#C9CED8;line-height:1.0;max-width:42px;text-align:center;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
#compfix .cmp-foe--more{justify-content:center;align-items:center;font-size:12px;font-weight:700;color:#C9A44C}
#compfix .cmp-card__pe{margin-top:auto;display:flex;align-items:center;gap:8px}
#compfix .cmp-card__left{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
#compfix .cmp-card__rec{font-size:13px;font-weight:700;color:#CDB3FF;white-space:nowrap}
#compfix .cmp-card__won{font-size:12px;color:#9AD3A0;white-space:nowrap}
#compfix .cmp-card__pe .cmpb{flex:none}
/* §352 — FOLHA DE COMPONENTES (dev, rota 'guia') */
body.emguia #build, body.emguia #conta-botao{display:none!important}
.stage.guia2{border:0;border-radius:0;box-shadow:none;background:#03050B}
#baselayer.guia2{position:absolute;inset:0;background:#03050B;overflow:hidden}
/* §367: a FOLHA DO GUIA migrou do canvas de 1846×852 para o PEQUENO de 780×360 (px de design = px real, como as telas
   do jogo). A grade de tiles é uma LISTA: rola por dentro (rolagem permitida em lista pelo §357). */
#guiafix{position:absolute;left:50%;top:50%;width:780px;height:360px;transform-origin:center;overflow:hidden;
  background:radial-gradient(130% 90% at 50% 0%,#0e1424 0%,#070a14 60%,#05070e 100%);color:#E8ECF4;font-family:'Rajdhani',system-ui,sans-serif;font-weight:600}
#guiafix .cin{font-family:'Cinzel',serif}
#guiafix .cmpb{border:0;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.04em;min-height:40px;font-size:14px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;color:#E8ECF4;background:rgba(14,18,32,.85);box-shadow:inset 0 0 0 1px rgba(201,164,76,.45)}
#guiafix .cmpb--primary{color:#2A1A04;background:linear-gradient(180deg,#FBE29A,#E9C25A 45%,#C9962F);box-shadow:inset 0 1px 0 rgba(255,250,225,.6),0 3px 10px rgba(0,0,0,.5);font-size:15px}
#guiafix .cmpb--quiet{background:rgba(10,13,22,.7);box-shadow:inset 0 0 0 1px rgba(154,164,184,.4);color:#C9CED8}
#guiafix .guia-cab{position:absolute;left:14px;right:14px;top:10px;height:40px;display:flex;align-items:center;gap:12px}
#guiafix .guia-titulo{font-size:16px;font-weight:900;letter-spacing:.04em;color:#F0D79A;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#guiafix .guia-sub{color:#AAB4C6;font-size:12px;margin-left:auto;white-space:nowrap}
#guiafix .guia-grade{position:absolute;left:14px;right:14px;top:56px;bottom:12px;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start;padding-right:6px}
#guiafix .guia-tile{box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:rgba(12,16,30,.7);box-shadow:inset 0 0 0 1px rgba(154,164,184,.18)}
#guiafix .guia-tile--g{grid-column:span 2}

   inimigos (~156px a partir da direita). O board já exclui topo+footer → nunca cobre o ENCERRAR TURNO, a barra

.inspecao{position:absolute;inset:0;z-index:40}

/* §359: canvas PEQUENO de 780×360 (= o celular); px de design = px real, cumpre o §357 direto. */
#dommontar{position:absolute;left:50%;top:50%;width:780px;height:360px;transform-origin:center;overflow:hidden;
  background:radial-gradient(130% 90% at 50% 0%,#0e1424 0%,#070a14 60%,#05070e 100%);color:#E8ECF4;

  background:rgba(14,18,32,.85);box-shadow:inset 0 0 0 1px rgba(201,164,76,.45);padding:0 12px;height:40px;font-size:13px;

.dm-ctx{position:absolute;left:8px;top:48px;width:192px;height:154px;box-sizing:border-box;border-radius:9px;padding:6px 9px;overflow:hidden;

.dm-vaga__txt{font-size:12px;color:#9AA4B8}
/* área direita SEUS DEUSES (coluna direita, 564px) */
.dm-dir{position:absolute;left:208px;top:50px;width:564px;height:268px;box-sizing:border-box;border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;gap:5px;

/* §359: filtros em 2 linhas FIXAS (como a Coleção §358b) — l1: Todos + orbes + contagem; l2: funções + busca */
.dm-filtros{display:flex;flex-direction:column;gap:5px}
.dm-filtros__l{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow:hidden}

#dommontar .dm-busca{width:100%;height:40px;border:0;border-radius:9px;padding:0 10px;font-family:inherit;font-size:13px;font-weight:600;color:#E8ECF4;background:rgba(10,13,22,.7);box-shadow:inset 0 0 0 1px rgba(154,164,184,.35);outline:none}

.dm-card__n{font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:#F7EEDC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 2px #000,0 0 3px #000;line-height:1.1}
.dm-card__meta{display:flex;align-items:center;gap:4px;font-size:12px;color:#D5DAE4;line-height:1.1}
.dm-card__f{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 2px #000,0 0 3px #000,0 1px 2px #000;}
.dm-card__nv{font-weight:700;color:#F0DC9A;white-space:nowrap}

.dm-card--sel::after{content:'';position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 3px #E9C25A;pointer-events:none;z-index:3}
/* rodapé — começar + motivo, sob a grade */
.dm-rodape{position:absolute;left:208px;right:8px;top:320px;height:40px;display:flex;align-items:center;justify-content:flex-end;gap:10px}
.dm-motivo{display:flex;align-items:center;gap:5px;font-size:12px;color:#F0D79A;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* dica discreta */
.dm-dica{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,12,20,.95);border-radius:8px;box-shadow:inset 0 0 0 1px rgba(201,164,76,.6);padding:6px 12px;font-size:12px;color:#F0D79A;z-index:40}
/* §359: painel de kit SEM ROLAGEM — passiva + 4 habilidades (texto completo) numa grade 2×2, tudo cabe nos 360 */
.dm-kit{position:absolute;inset:0;background:rgba(4,6,14,.72);display:flex;align-items:center;justify-content:center;z-index:30}
.dm-kit__card{position:relative;width:764px;max-width:98%;max-height:354px;display:flex;flex-direction:column;background:linear-gradient(180deg,#121a2c,#0a0e1a);border-radius:12px;box-shadow:inset 0 0 0 1px rgba(201,164,76,.6),0 10px 30px rgba(0,0,0,.6);overflow:hidden}
.dm-kit__cab{flex:none;display:flex;align-items:center;gap:9px;padding:6px 12px 5px;border-bottom:1px solid rgba(201,164,76,.25)}
.dm-kit__x{margin-left:auto;flex:none;width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;background:rgba(14,18,32,.9);box-shadow:inset 0 0 0 1px rgba(201,164,76,.5);color:#F0D79A;font-size:16px}
.dm-kit__p{width:40px;height:40px;flex:none;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(201,164,76,.6)}
.dm-kit__id{min-width:0}
.dm-kit__nome{margin:0;font-size:17px;color:#F0D79A;line-height:1.05}
.dm-kit__meta{display:flex;align-items:center;gap:5px;font-size:12px;color:#C9CED8}
.dm-kit__scroll{flex:1;min-height:0;overflow:hidden;padding:6px 12px;display:flex;flex-direction:column;gap:6px}
.dmk-pas{display:flex;flex-direction:column;gap:1px;padding:5px 9px;border-radius:7px;background:rgba(10,13,22,.6);box-shadow:inset 0 0 0 1px rgba(154,164,184,.25)}
.dmk-pas__t{font-size:12px;color:#C9A44C;font-weight:700;letter-spacing:.03em}
.dmk-pas__d{font-size:12px;color:#D5DAE4;line-height:1.25}
.dm-kit__abs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dmk-ab{display:flex;gap:7px;padding:5px 8px;border-radius:7px;background:rgba(10,13,22,.5);box-shadow:inset 0 0 0 1px rgba(154,164,184,.22)}
.dmk-ab__art{width:40px;height:40px;flex:none;border-radius:6px;overflow:hidden;background:#0A0E1C;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.dmk-ab__art .slot{width:100%;height:100%}.dmk-ab__art img{width:100%;height:100%;object-fit:cover}
.dmk-ab__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.dmk-ab__top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dmk-ab__n{font-size:13px;font-weight:700;color:#F0D79A}
.dmk-ab__tag{font-size:12px;letter-spacing:.04em;color:#9AA4B8;font-weight:700}
.dmk-ab__nv{font-size:12px;color:#F0DC9A;font-weight:700;padding:0 5px;border-radius:5px;background:rgba(6,8,16,.7)}
.dmk-ab__meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#C9CED8;min-height:0}
.dmk-ab__orbs{display:inline-flex;align-items:center;gap:4px}
.dmk-ab__gratis{font-weight:700;letter-spacing:.03em;color:#4BE38A}  /* §340: verde-pronta */
.dmk-ab__cd{color:#9AA4B8}
.dmk-ab__desc{font-size:12px;color:#D5DAE4;line-height:1.22}
.dm-kit__pe{flex:none;padding:5px 12px 7px;display:flex;justify-content:flex-end;border-top:1px solid rgba(201,164,76,.25)}
.dm-kit__pe .dmb--go{min-width:150px;font-size:13px}
/* ===== §344/§359 — montador nos outros modos (Campanha, Composição, PvP) + seletor de troca ===== */
.dm-ctx__dica{font-size:12px;color:#C9CED8;line-height:1.25;margin:0 0 4px}
.dm-ctx__val{font-size:12px;font-weight:700;margin:3px 0 5px}.dm-ctx__val.ok{color:#4BE38A}.dm-ctx__val.nao{color:#E0545B}
.dm-erro{font-size:12px;color:#F2B8C0;margin:5px 0 0}
/* cartão que viola a regra (Composição): apagado, não selecionável, com o motivo */
.dm-card--off{filter:grayscale(.85) brightness(.5);cursor:default}
.dm-card--off .dm-card__i{display:none}
.dm-card__off{position:absolute;left:0;right:0;top:calc(50% - 8px);text-align:center;font-size:12px;font-weight:700;color:#F2B8C0;text-shadow:0 1px 4px rgba(0,0,0,.9);z-index:4;padding:0 4px}
/* PvP — bloco de contexto */
.dm-pvp__nick{font-size:12px;color:#C9CED8;margin-bottom:5px}.dm-pvp__nick b{color:#F0D79A}
.dm-pvp__nicklab{display:block;font-size:12px;color:#9AA4B8;margin-bottom:3px}
.dm-pvp__nickin{width:100%;box-sizing:border-box;height:40px;border:0;border-radius:8px;padding:0 10px;font-family:inherit;font-size:13px;color:#E8ECF4;background:rgba(10,13,22,.7);box-shadow:inset 0 0 0 1px rgba(154,164,184,.4);outline:none}
.dm-seg{display:flex;gap:0;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(201,164,76,.5);margin:3px 0}
.dm-seg__b{flex:1;height:40px;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.02em;color:#C9CED8;background:rgba(12,16,30,.8)}
.dm-seg__b.is-on{color:#2A1A04;background:linear-gradient(180deg,#F4D98A,#E9C25A)}
.dm-pvp__modolinha{font-size:12px;color:#9AA4B8;margin:0 0 4px}
.dm-pvp__ranque,.dm-pvp__rec{font-size:12px;color:#C9CED8;margin-bottom:3px}.dm-pvp__ranque b,.dm-pvp__rec b{color:#F0D79A}
.dm-pvp__reveal{font-size:12px;color:#9AA4B8;margin:2px 0 3px;line-height:1.15}
/* "↺ Usar último time" acima das vagas */
.dm-usarultimo{box-sizing:border-box;height:40px;border:0;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;color:#EAEEF6;background:rgba(8,11,22,.95);box-shadow:inset 0 0 0 1px rgba(154,164,184,.4);padding:0 10px;white-space:nowrap}
.dm-usarultimo[disabled]{color:#5c6276;cursor:default;box-shadow:inset 0 0 0 1px rgba(80,88,110,.4)}
/* grade travada (PvP na fila) */
.dm-grade--travada{filter:grayscale(.7) brightness(.5);pointer-events:none}
/* PvP na fila — painel central */
.dm-fila{position:absolute;inset:0;background:rgba(4,6,14,.78);display:flex;align-items:center;justify-content:center;z-index:30}
.dm-fila__card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 32px;border-radius:12px;background:linear-gradient(180deg,#121a2c,#0a0e1a);box-shadow:inset 0 0 0 1px rgba(201,164,76,.6),0 10px 30px rgba(0,0,0,.6)}
.dm-fila__ic{font-size:26px;color:#C9A44C;animation:dfspin 2.4s linear infinite}
.dm-fila__t{margin:0;font-size:17px;color:#F0D79A;font-weight:900;letter-spacing:.03em}
.dm-fila__modo{font-size:12px;color:#C9CED8;margin:0}
.dmb--quietbig{height:40px;font-size:13px;padding:0 18px;background:rgba(10,13,22,.7);box-shadow:inset 0 0 0 1px rgba(154,164,184,.5);color:#C9CED8;margin-top:4px}
/* aviso (PvP sem servidor/sem conta) */
.dm-aviso{position:absolute;left:8px;right:8px;top:96px;display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:9px;background:rgba(14,18,32,.85);box-shadow:inset 0 0 0 1px rgba(201,164,76,.4)}
.dm-aviso__ic{font-size:20px;color:#C9A44C;flex:none}
.dm-aviso p{font-size:13px;line-height:1.35;color:#D5DAE4;margin:0}
/* grade em LARGURA CHEIA (seletor de troca da campanha) */
.dm-dir--full{left:8px;right:8px;width:auto;top:56px;height:298px}
#dommontar.dm-troca .dm-grade{grid-template-columns:repeat(6,1fr)}   /* §344c: mais colunas p/ manter o tamanho dos cartões na largura cheia */
/* seletor de troca — host no #viewport (fora do stage), escala própria a 780×360 */
.dm-troca-ov{position:fixed;inset:0;z-index:60;background:rgba(4,6,14,.78)}
/* §359: X claro (≥40px) p/ fechar a troca sem gravar campSwap */
.dm-troca-x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:10px;cursor:pointer;
  background:rgba(14,18,32,.94);box-shadow:inset 0 0 0 2px rgba(201,164,76,.6);color:#F0D79A;font-size:22px;font-weight:700;line-height:1;z-index:4}

/* ============ §345/§359 — BATALHA CPU / HOT-SEAT (montador de DOIS times), canvas 780×360 ============ */
/* cartão do OPONENTE (lado 1): moldura e número VERMELHOS (J1 segue dourado do §342b) */
.dm-card--sel2{box-shadow:0 0 12px rgba(224,84,91,.4)}
.dm-card--sel2::after{box-shadow:inset 0 0 0 3px #E0545B}
.dm-card--sel2 .dm-card__vaga{background:#B3161E;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.95)}
/* na visão "Todos": deus bloqueado/WIP não entra (sem data-pick) — marca e esmaece */
.dm-card--trav{opacity:.62;cursor:default}
.dm-card--trav .dm-card__p{filter:grayscale(.55) brightness(.8)}
.dm-card__trav{position:absolute;top:3px;left:3px;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:rgba(8,11,20,.9);box-shadow:inset 0 0 0 1px rgba(154,164,184,.5);color:#C9CED8;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:3}
/* §359 coluna esquerda (300px): dois blocos de time EMPILHADOS; cada time = 3 CHIPS verticais numa linha + opções embaixo */
.dm--sel .sel-times{position:absolute;left:8px;top:48px;width:300px;display:flex;flex-direction:column;gap:5px}
.sel-time{box-sizing:border-box;border-radius:8px;padding:4px 6px;background:linear-gradient(180deg,rgba(18,24,44,.92),rgba(10,14,26,.9));box-shadow:inset 0 0 0 1px rgba(201,164,76,.5);display:flex;flex-direction:column;gap:3px}
.sel-time.is-vez{box-shadow:inset 0 0 0 2px #E9C25A,0 0 12px rgba(240,180,60,.3)}
.sel-time--op{box-shadow:inset 0 0 0 1px rgba(224,84,91,.5)}
.sel-time--op.is-vez{box-shadow:inset 0 0 0 2px #E0545B,0 0 12px rgba(224,84,91,.3)}
.sel-time__cab{display:flex;align-items:center;gap:5px}
.sel-time__t{margin:0;font-size:13px;color:#F0D79A;font-weight:900;letter-spacing:.03em}
.sel-time--op .sel-time__t{color:#F2B6BA}
.sel-time__who{font-size:12px;font-weight:700;letter-spacing:.03em;color:#C9CED8;background:rgba(10,13,22,.6);border-radius:5px;padding:0 5px}
.sel-time__c{margin-left:auto;font-size:12px;font-weight:700;color:#9AA4B8}
.sel-time__lista{display:flex;flex-direction:row;gap:4px}
.sel-vaga{flex:1 1 0;min-width:0;box-sizing:border-box;border:0;cursor:pointer;font-family:inherit;color:inherit;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 2px;border-radius:7px;background:rgba(10,13,22,.6);box-shadow:inset 0 0 0 1px rgba(201,164,76,.35)}
.sel-time--op .sel-vaga{box-shadow:inset 0 0 0 1px rgba(224,84,91,.3)}
.sel-vaga__num{position:absolute;top:1px;left:3px;font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:#EBD08A;line-height:1;text-shadow:0 0 2px #000,0 0 3px #000,0 1px 2px #000;background:#0a0e1a;padding:1px 4px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.6);}
.sel-time--op .sel-vaga__num{color:#EE7A80}
.sel-vaga__p{width:32px;height:32px;flex:none;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.sel-vaga__n{font-size:12px;font-weight:700;color:#F0D79A;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.sel-vaga--vazia{justify-content:center;cursor:default}
.sel-vaga--vazia .sel-vaga__num{color:#8891a6}
.sel-vaga__add{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:5px;background:rgba(14,18,32,.6);color:#6b7488;font-size:18px;font-weight:700}
.sel-ops{flex:1 1 100%;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;padding:6px 8px;border-radius:8px;background:linear-gradient(180deg,rgba(18,24,44,.9),rgba(10,14,26,.88));box-shadow:inset 0 0 0 1px rgba(154,164,184,.25)}
.sel-seg{display:flex;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(154,164,184,.4)}
.sel-seg__b{flex:1;height:40px;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.01em;color:#9AA4B8;background:rgba(10,13,22,.6)}
.sel-seg__b.is-on{color:#2A1A04;background:linear-gradient(180deg,#FBE29A,#E9C25A 45%,#C9962F)}
.sel-sortear{margin-top:0;width:100%;height:40px;font-size:13px;background:rgba(10,13,22,.7);box-shadow:inset 0 0 0 1px rgba(154,164,184,.5);color:#E8ECF4}
.sel-info{margin:0;font-size:12px;line-height:1.25;color:#C9CED8}
.sel-info b{color:#F0D79A}
/* pílula do estado (Liberados|Todos) + badge do "Mais filtros" */
.sel-pill--todos{color:#2A1A04;background:linear-gradient(180deg,#FBE29A,#E9C25A 45%,#C9962F)}
.sel-badge{margin-left:5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E9C25A;color:#2A1A04;font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
/* grade/rodapé da seleção: coluna esquerda é mais larga (300px) → grade à direita a partir de 316px */
.dm--sel .dm-dir{left:316px;width:456px}
.dm--sel .dm-grade{grid-template-columns:repeat(4,1fr)}
.dm--sel .dm-rodape{left:316px}
/* rodapé: Invocar/Teste discretos à esquerda, COMEÇAR à direita */
.sel-mini-wrap{margin-right:auto;display:flex;gap:6px}
.sel-mini{height:40px;font-size:12px;padding:0 10px;background:rgba(10,13,22,.5);box-shadow:inset 0 0 0 1px rgba(154,164,184,.3);color:#9AA4B8}
.sel-mini.is-on{color:#F0D79A;box-shadow:inset 0 0 0 1px rgba(201,164,76,.6)}
/* painel "MAIS FILTROS" — centrado na tela fixa, com o scrim por fora */
.sel-fpanel{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(4,6,14,.78)}
.sel-fbox{width:560px;max-width:96%;max-height:94%;overflow:hidden}
#dommontar .sel-fbox{border-radius:12px}
#dommontar .sel-fbox .fbox__h{padding:8px 12px}
#dommontar .sel-fbox .fbox__h h2{font-size:16px}
#dommontar .sel-fbox .fbox__n{font-size:12px}
#dommontar .sel-fbox .fbox__n b{font-size:14px}
#dommontar .sel-fbox .fbox__b{padding:8px 12px 10px;overflow:hidden}
#dommontar .sel-fbox .fgrp{gap:8px;padding:5px 0}
#dommontar .sel-fbox .fgrp__l{width:72px;font-size:12px;padding-top:9px}
#dommontar .sel-fbox .fgrp__c{gap:5px}
#dommontar .sel-fbox .chip2{min-height:40px;box-sizing:border-box;padding:0 10px;border-radius:16px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
#dommontar .sel-fbox .chip2__n{font-size:12px}

/* ======================= §335 — BATALHA (design do dono, tela fixa 1846×852) ======================= */
/* §362 — a moldura (#stage) vira a canvas #03050B sem borda; o #batalha (780×360) se escala via JS (fit). */
.stage.bt2{border:0;border-radius:0;box-shadow:none;background:#03050B}
#baselayer.bt2{position:absolute;inset:0;background:#03050B;overflow:hidden}
#batalha{position:absolute;left:50%;top:50%;width:780px;height:360px;transform-origin:center;overflow:hidden;
  background:radial-gradient(70% 60% at 50% 40%,#0B1226 0%,#060914 60%,#03050B 100%);
  font-family:'Rajdhani',sans-serif;color:#EAF0FF;user-select:none}
#batalha .cin{font-family:'Cinzel',serif}
/* §362: as imagens da batalha não capturam toque — o DIV (retrato/skill/mini) trata o toque, e o texto por cima
   (vida, SEU TURNO, etc.) não fica "encoberto" pela própria arte no elementFromPoint (eixo d6). */
#batalha img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
#batalha .slot{position:relative;width:100%;height:100%;pointer-events:none}
/* §362: dentro de um botão de habilidade/mini o DIV trata o toque; os filhos (arte, glifo, custo/GRÁTIS, badges) não
   capturam toque, p/ o texto por cima não ficar "encoberto" pela arte-disco no elementFromPoint (eixo d6). */
#batalha .b5-skill *{pointer-events:none}
#batalha .slot img{width:100%;height:100%;object-fit:cover}
#batalha .slot__glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:900;text-shadow:0 0 2px #000,0 0 3px #000,0 1px 2px #000;}
.b5-art{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.b5-art img{width:100%;height:100%;object-fit:cover}
.b5-art--contain img{object-fit:contain}
/* botão de habilidade: arte cheia preenche; disco recorta (§332/§334); o monograma é RESERVA (some com a arte) */
.b5-skill img.slot__art--cheia{object-fit:cover}
#batalha .b5-skill:has(.slot__art) .b5-mono{opacity:0}
.b5-hover{cursor:pointer;transition:background .12s}
.b5-hover:hover{background:rgba(201,164,76,.12)}
/* mira vermelha do inimigo alvo (animada) */
@keyframes b5mira{0%,100%{opacity:.75}50%{opacity:1}}
.b5-mira{animation:b5mira 1s ease-in-out infinite}
.b5-cancel:hover{background:linear-gradient(180deg,#141A30,#080B16)!important}
.b5-end:hover{filter:brightness(1.05)}
.b5-menuitem:hover{background:rgba(201,164,76,.1)}
.b5-range{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,#C9A44C,#6b5220);outline:none}
.b5-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#F0DC9A;border:1px solid #2A1A04;cursor:pointer}
.b5-range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#F0DC9A;border:1px solid #2A1A04;cursor:pointer}
</style>
