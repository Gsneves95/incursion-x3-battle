.home__sub{display:block;margin-top:4px;font-weight:600;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-mute)}
.hscroll{flex:1 1 auto;min-height:0;display:flex;align-items:center;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.htrack{display:flex;gap:14px;padding:0 18px;flex:0 0 auto;margin:0}
.bcard{position:relative;flex:0 0 202px;width:202px;height:314px;padding:0;margin:0;
  border:1px solid var(--gold-soft);border-radius:14px;overflow:hidden;cursor:pointer;
  background:var(--panel-2);scroll-snap-align:start;
  transition:transform .08s ease,border-color .12s ease,box-shadow .12s ease}
.bcard:active{transform:translateY(1px) scale(.99)}
.bcard:focus{outline:none}
.bcard:focus-visible{border-color:var(--gold-text);   /* SELECIONADO = contorno, sem hover */
  box-shadow:0 0 0 2px var(--gold-text),0 10px 26px rgba(0,0,0,.55)}
.bcard__art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bcard__fallback{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:26px;font-family:'Cinzel',serif;font-weight:800;font-size:19px;letter-spacing:.06em;
  color:var(--gold-text);text-align:center;
  background:linear-gradient(180deg,var(--panel),var(--panel-2))}
.bcard:has(.bcard__art) .bcard__fallback{display:none}   /* arte presente esconde o rótulo-reserva */
/* §213: cartão de ESPERA (Desafios sem arte ainda) — fundo escuro + título em ouro, padrão da série */
.bcard__ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(120% 90% at 50% 12%,rgba(40,32,72,.7),var(--panel-2) 62%,#0b0918);
  border-radius:13px;overflow:hidden}
.bcard__ph::before{content:"";position:absolute;inset:12px;border:1px solid rgba(216,178,90,.28);border-radius:9px;pointer-events:none}
.bcard__ph-orn{font-size:26px;color:var(--gold-text);opacity:.55;line-height:1}
.bcard__ph-sub{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-mute)}
.bcard__ph-t{font-family:'Cinzel',serif;font-weight:800;font-size:22px;letter-spacing:.05em;color:var(--gold-text);
  text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.6)}
/* selo de canto (Provações/Invocação/Coleção/PvP): TOPO — o título mora na base da arte */
.bcard__selo{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:999px;
  font-family:'Rajdhani',sans-serif;font-weight:800;font-size:13px;letter-spacing:.03em;
  color:#0e0a1a;background:linear-gradient(180deg,#ffe9ad,var(--gold));
  box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.25)}
/* Campanha: faixa no rodapé (limpo na arte) — capítulo·região à esq., feitos/total à dir. + barra */
.bcard__faixa{position:absolute;left:0;right:0;bottom:0;padding:8px 10px 9px;
  background:linear-gradient(0deg,rgba(6,5,14,.94),rgba(6,5,14,.55) 72%,transparent);
  font-family:'Rajdhani',sans-serif}
.bcard__faixatop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-weight:700;font-size:11.5px;letter-spacing:.02em;color:var(--ink);text-transform:uppercase}
.bcard__prog{color:var(--gold-text);font-weight:800;white-space:nowrap}
.bcard__barra{margin-top:5px;height:5px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.14)}
.bcard__barra>i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#37cfe6,var(--gold-text))}   /* ciano→ouro: as cores da arte */
.bcard--off{cursor:default}
/* §250: `.bcard--pvp` (o cinza "Fase 5" + o selo cinza) removido — o PvP tem funcionalidade
   (lobby §236 · pareamento §225 · ranqueado §226 · servidor §237). O cinza é a linguagem de
   "travado/não tem" (Coleção §216, Missões §234); num cartão com rota viva ele lê como
   indisponível logo na 1ª tela (usabilidade §206). O guarda do render_sweep trava a volta. */

/* §306/§310 — a HOME vira MAPA estático (o carrossel acima fica de FALLBACK, sem a arte do mapa).
   §310: a arte nova (2400×999, 2,40) PREENCHE o palco; os ícones ancoram em % DA ARTE (left/top da .ilha).
   O overflow:hidden é o que CORTA as laterais quando o palco é mais estreito que a arte (piso 780 → -24%). */
.mapa{position:absolute;inset:0;z-index:2;overflow:hidden}
/* §309b/§310: a EXTENSÃO desfocada — cópia do mapa cobrindo o palco, DESFOCADA, sob a caixa nítida (letterbox-blur de
   app de vídeo). §310 REBAIXOU seu papel: a arte larga (2,40) PREENCHE o palco no aparelho do dono (893) e no piso (780),
   e a extensão só aparece ACIMA de 2,40 (o navegador do dono a 1075, o teto a 1200), onde sobra faixa lateral. Nas
   larguras em que a arte preenche, a extensão fica INTEIRAMENTE atrás da caixa nítida — não aparece. Mesmo arquivo
   (banners/mapa.webp) em cache → PESO ZERO; scale(1.08) esconde a borda transparente que o blur puxa. Brilho .75 + blur 20
   (§309b) leem como a mesma cena fora de foco (razão de brilho ~0,71 contra o mapa, a mira do dono: 60–80%). */
.mapa__fundo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0;pointer-events:none;
  transform:scale(1.08);filter:blur(20px) brightness(.75) saturate(.95)}
/* §310: a caixa DEIXA de ser travada em 1,78 (aquela trava existia para a arte antiga 1524×856). A arte nova (2400×999,
   2,40) deve PREENCHER o palco. A caixa passa a ter a ALTURA do palco (428) e a LARGURA natural da arte a essa altura
   (428 × 2400/999 ≈ 1028px), centrada; o overflow:hidden da .mapa corta o excedente lateral quando o palco é mais estreito
   (piso 780 → corta 24% da largura; 893 → 13%). Mantém a lição do §308b: px EXPLÍCITO (1028×428) e FORA DO FLUXO
   (absolute) — nenhum motor negocia; um filho absoluto não é flex-item, o Galaxy S24 não estica. A razão 1028/428 (2,4019)
   casa a arte (2,4024) a menos de 0,03% → o cover não corta nada perceptível. Os ícones ancoram em % de 1028×428. */
.mapa__caixa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1028px;height:428px;z-index:1}
.mapa__art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mapa__scrim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 82% at 50% 42%,transparent 56%,rgba(6,5,16,.34) 100%)}
/* topo: apelido+faixa à esq., moedas à dir. (§305: sem envelope, sem sino, sem barra de nível) */
.mapa__topo{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;
  justify-content:space-between;gap:10px;padding:4px 14px 10px;pointer-events:none;   /* §367: sobe o chip p/ não encostar na ilha Campanha no canvas 780×360 */
  background:linear-gradient(180deg,rgba(6,5,16,.66),rgba(6,5,16,0))}
.mperfil{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;margin:0;
  border:1px solid var(--gold-soft);border-radius:999px;background:rgba(12,10,26,.72);cursor:pointer}
.mperfil__pic{width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:1px solid var(--gold-soft);overflow:hidden;display:block}
.mperfil__pic svg,.mperfil__pic img{width:100%;height:100%;display:block}
.mperfil__id{display:flex;flex-direction:column;line-height:1.12;min-width:0;text-align:left}
.mperfil__nick{font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:var(--gold-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.mperfil__faixa{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-dim)}
.mmoedas{pointer-events:auto;display:flex;gap:8px;align-items:center}
.mmoeda{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;
  border:1px solid var(--gold-soft);background:rgba(12,10,26,.72);
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:var(--ink)}
.mmoeda b{color:var(--gold-text);font-weight:800}
.mmoeda__ic{font-size:12px;line-height:1}
.mmoeda__ic--ess{color:#7fe3d6}
/* uma ILHA: ícone + nome + contador, ancorada no CENTRO (translate) sobre o ponto da arte. */
.ilha{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:1px;width:100px;margin:0;padding:0;border:0;background:none;cursor:pointer;
  font:inherit;text-align:center;color:var(--ink);z-index:3}
/* §311: FUNDO ESCURO atrás de cada ilha, com as bordas DESVANECENDO até transparente (radial, nada de caixa com borda
   dura — pedido do dono desde o §309). Serve o contraste: "DOMÍNIOS" sumia no clarão do portal e "· em breve" da Loja no
   telhado; os outros liam por sorte (caíram sobre partes escuras). O radial baixa o brilho do fundo COMPOSTO sob o texto
   até o piso 4,5 (§304e/§281: a medição do pixel mais claro é pessimista; a captura é o veredito). Fica ATRÁS do ícone e
   do texto (z-index:-1 no contexto da própria ilha, que está a z-index:3 sobre a arte). Centrado no bloco de texto
   (embaixo do ícone), onde a leitura mora. */
.ilha::before{content:"";position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);
  width:140px;height:92px;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 58% 58% at 50% 50%,rgba(5,4,14,.74) 0%,rgba(5,4,14,.7) 68%,rgba(5,4,14,0) 93%)}
/* §311c: o fundo padrão é LEVE (a sombra do texto carrega — medido: 8 das 9 ilhas caem sobre arte escura e sobram muito
   contraste). Só as ilhas marcadas `fundoForte` no dado (sobre arte CLARA — hoje só a Campanha, sobre a cachoeira) mantêm
   o fundo FIRME, onde o pixel claro estoura o piso 4,5. Assim o alívio da tela toda não fica refém do pior caso único. */
/* §367: no canvas fixo 780×360 a arte atrás das ilhas `fundoForte` (campanha=cachoeira, invocação=templo, domínios=portal,
   loja=telhado) ficou mais clara sob o RÓTOLO INTEIRO (nome+contador+barra). O véu escuro cresce e cobre a ilha toda
   (não só o topo), para o rótulo ler ≥4,5 mesmo no pixel mais claro (a sombra do texto, que o teste ignora, só soma). */
.ilha--fundoforte::before{width:154px;height:128px;top:56%;background:radial-gradient(ellipse 64% 62% at 50% 50%,rgba(5,4,14,.92) 0%,rgba(5,4,14,.9) 72%,rgba(5,4,14,0) 96%)}
.ilha:focus{outline:none}
.ilha:focus-visible .ilha__ic{filter:drop-shadow(0 0 0 var(--gold-text)) drop-shadow(0 3px 8px rgba(0,0,0,.7));outline:2px solid var(--gold-text);outline-offset:2px;border-radius:8px}
.ilha:active{transform:translate(-50%,-50%) scale(.96)}
/* §311: ícone 62→48px. A 48 de design dá ~40 físicos no S24 (bem acima do piso de toque 28–34, §301) e PARA DE TAPAR a
   ilha que ele marca — a arte larga (§310) existe para ser vista. O alvo de toque real é a .ilha inteira (100px), não só
   o glifo. */
.ilha__ic{width:48px;height:48px;object-fit:contain;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))}
.ilha__reserva{display:none;width:48px;height:48px;align-items:center;justify-content:center;
  font-size:22px;color:var(--gold-text);opacity:.6;
  border:1px solid rgba(216,178,90,.4);border-radius:50%;background:rgba(12,10,26,.8)}
.ilha--semarte .ilha__reserva{display:flex}
.ilha--semarte .ilha__ic{display:none}
.ilha__nome{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.03em;
  color:#fff;text-shadow:0 0 3px #000,0 0 7px rgba(0,0,0,.92),0 1px 3px #000,0 2px 8px rgba(0,0,0,.95);margin-top:2px;white-space:nowrap}
.ilha__cont{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:10px;letter-spacing:.02em;
  color:var(--gold-text);text-shadow:0 0 3px #000,0 0 6px rgba(0,0,0,.92),0 1px 2px #000,0 1px 5px rgba(0,0,0,.95);white-space:nowrap}
.ilha__cont--camp{display:flex;gap:5px;align-items:baseline;justify-content:center}
.ilha__campnum{color:#fff;font-weight:700}
.ilha__barra{margin-top:2px;width:74px;height:3px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22)}
.ilha__barra>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#37cfe6,var(--gold-text))}
/* EM BREVE (§306: Domínios, Loja) — NÃO abre e não parece defeito (nunca vermelho). §311: com o fundo escuro atrás, o
   sinal de "indisponível" passa a viver no ÍCONE apagado+dessaturado e na palavra "em breve"; o texto FICA CLARO (o dim
   roxo/dourado-escuro do §306 lia bem sobre arte clara mas SUMIRIA sobre o fundo escuro — a leitura é o piso). */
.ilha--breve{cursor:default}
.ilha--breve .ilha__ic{opacity:.5;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7)) grayscale(.25)}
.ilha--breve .ilha__nome{color:#cfc7e6;text-shadow:0 0 3px #000,0 0 7px rgba(0,0,0,.92),0 1px 3px #000,0 2px 8px rgba(0,0,0,.95)}
.ilha__breveTag{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:#f0cd82;text-shadow:0 0 3px #000,0 0 6px rgba(0,0,0,.92),0 1px 3px #000,0 1px 5px rgba(0,0,0,.95)}

/* telas de lista (Provações) e marcador (Campanha/Invocação/Coleção) */
.tela{position:absolute;inset:0;display:flex;flex-direction:column;z-index:2;overflow:hidden}
.tela__cab{flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:14px 24px;border-bottom:1px solid rgba(216,178,90,.22);
  background:linear-gradient(180deg,rgba(12,10,26,.85),rgba(12,10,26,0))}
.tela__titulo{flex:1 1 auto;font-family:'Cinzel',serif;font-weight:900;font-size:22px;
  letter-spacing:.12em;color:var(--gold-text);margin:0}
.tela__cont{flex:0 0 auto;min-width:34px;text-align:center;font-family:'Cinzel',serif;
  font-weight:700;font-size:15px;color:var(--ink-dim);border:1px solid var(--gold-soft);
  border-radius:20px;padding:3px 12px}
.tela__espaco{flex:0 0 34px}
.tela__rol{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:10px 24px 20px}
/* marcador "em breve" */
.tela__vazio{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:14px;color:var(--ink-mute)}
.tela__vazioic{font-family:'Cinzel',serif;font-size:56px;color:var(--gold-soft);opacity:.7}
.tela__vaziomsg{font-weight:600;font-size:15px;line-height:1.5;color:var(--ink-dim);max-width:420px}

/* seções e linhas da lista de Provações */
.psec__cab{display:flex;align-items:baseline;gap:10px;margin:12px 2px 6px}
.psec__cab:first-child{margin-top:2px}
.psec__cab h2{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-dim);margin:0}
.psec__n{font-weight:700;font-size:12px;color:var(--ink-mute)}
.psec__vazio{font-weight:600;font-size:13px;line-height:1.5;color:var(--ink-mute);padding:4px 2px 8px}
/* F4: cabeçalho do acervo + nota + PÍLULAS DE FAIXA (dificuldade dos nós medidos) */
.psec__cab--acervo{margin-top:16px;border-top:1px solid rgba(216,178,90,.16);padding-top:12px}
.psec__nota{font-weight:600;font-size:11.5px;line-height:1.5;color:var(--ink-mute);margin:0 2px 8px}
.prow__faixa,.dprov__faixa{font-family:'Rajdhani',sans-serif;font-weight:800;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.faixa--facil{color:#58d68d;background:rgba(88,214,141,.10)}
.faixa--medio{color:#e7bd74;background:rgba(231,189,116,.10)}
.faixa--dificil{color:#ff9db4;background:rgba(255,157,180,.10)}
.faixa--epico{color:#b98cff;background:rgba(185,140,255,.12)}
.psec__faixa.faixa--facil,.psec__faixa.faixa--medio,.psec__faixa.faixa--dificil,.psec__faixa.faixa--epico{background:none;border:0;padding:0}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:11px;padding:9px 12px;min-height:54px;
  background:rgba(20,16,38,.62);border:1px solid #2c2648;border-radius:10px}
.prow__p{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center}
.prow__p .slot{width:34px;height:34px;border-radius:7px;overflow:hidden}
.prow__el{flex:0 0 auto;width:4px;height:34px;border-radius:2px}
.prow__id{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow__deus{display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-weight:700;
  font-size:14px;letter-spacing:.04em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow__tit{font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--ink-mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow__selo{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--e-Verdejante);border:1px solid rgba(88,214,141,.5);
  border-radius:10px;padding:1px 7px;flex:0 0 auto}
.prow__meta{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.prow__niv{font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 10px;border-radius:6px;white-space:nowrap;
  color:var(--gold-text);border:1px solid var(--gold-soft);background:rgba(216,178,90,.08)}
.prow__niv.niv--0{color:var(--e-Verdejante);border-color:rgba(88,214,141,.45);background:rgba(88,214,141,.08)}
.prow__niv.niv--2{color:var(--e-Chama);border-color:rgba(255,92,138,.45);background:rgba(255,92,138,.08)}
.prow__dif{display:inline-flex;gap:3px}
.prow__dif i{width:7px;height:7px;transform:rotate(45deg);background:#3a3358;border-radius:1px}
.prow__dif i.on{background:var(--gold-text)}
.prow--feita{opacity:.72;border-style:dashed}
.prow--feita .prow__deus{color:var(--ink-dim)}
.prowli{list-style:none}
.prow{width:100%;text-align:left;cursor:pointer;font-family:inherit;transition:border-color .12s ease,transform .08s ease}
.prow:active{transform:translateY(1px) scale(.995);border-color:var(--gold-text)}
.prow__seta{font-family:'Cinzel',serif;font-weight:900;font-size:15px;color:var(--gold-soft);margin-left:2px}
.prow--feita .prow__seta{color:var(--ink-mute)}

/* ===================== F3.1/§207 — HUD da condição: UMA LINHA na FAIXA SUPERIOR, fora do tabuleiro =====================
   O HUD mora numa faixa ENTRE a barra de topo (0–63) e os times (que descem p/ 88 em `temhud`), nunca sobre os
   discos/retratos. `temhud` recompõe o layout SÓ quando há HUD: times descem, o rodapé encolhe p/ caber os 3. */
/* §214: o board desce e encolhe quando há HUD, para o HUD morar numa faixa PRÓPRIA (top 47,
   entre a barra de topo e as fileiras) — nunca sobre os tiles/retratos, e as fileiras nunca
   cruzam o rodapé (board fica 68..382; rodapé 382..428). */
#baselayer.temhud .board{top:68px;bottom:86px}
.phud{position:absolute;left:8px;right:8px;top:47px;height:19px;z-index:4;pointer-events:none;
  display:flex;align-items:center;gap:10px;overflow:hidden;
  background:linear-gradient(180deg,rgba(10,8,22,.92),rgba(10,8,22,.72));
  border:1px solid var(--gold-soft);border-radius:7px;padding:0 11px}
.phud__prazo{flex:0 0 auto;font-weight:700;font-size:11.5px;letter-spacing:.03em;color:var(--ink-dim);white-space:nowrap}
.phud__prazo b{color:var(--ink);font-size:12.5px}
.phud__prazo.perigo,.phud__prazo.perigo b{color:var(--e-Chama)}
.phud__chips{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap}
.phud__chip{flex:0 1 auto;min-width:0;display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:10.5px;
  letter-spacing:.02em;color:var(--ink-dim);border:1px solid #2c2648;border-radius:11px;
  padding:1px 8px;background:rgba(16,13,32,.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phud__chip i{flex:0 0 auto;font-style:normal;font-weight:800;font-size:10px;opacity:.9}
.phud__chip b{flex:0 0 auto;color:var(--ink);font-weight:700;margin-left:1px}
.phud__chip--cumprida{color:var(--e-Verdejante);border-color:rgba(88,214,141,.45)}
.phud__chip--cumprida i{color:var(--e-Verdejante)}
.phud__chip--quebrada{color:var(--e-Chama);border-color:rgba(255,92,138,.5);background:rgba(255,92,138,.08)}
.phud__chip--quebrada i{color:var(--e-Chama)}
/* §273 — chips de DOMÍNIOS na faixa da batalha */
.phud__chip--andamento{color:var(--ink-dim);border-color:#2c2648}
.phud__chip--ok{color:var(--gold-text);border-color:rgba(216,178,90,.5);background:rgba(216,178,90,.10)}
.phud__chip--ok i{color:var(--gold-text)}
.phud__chip--falha{color:var(--e-Chama);border-color:rgba(255,92,138,.5);background:rgba(255,92,138,.10)}
.phud__chip--falha i{color:var(--e-Chama)}

/* §273 — DOMÍNIOS: HUB (entrada/corrida/prêmio) e fichas do trio */
.domhub{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 4px 20px;text-align:center}
.domhub__sub{margin:0;font-size:11.5px;letter-spacing:.05em;color:var(--ink-mute);text-transform:uppercase}
.domsec{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:rgba(14,11,30,.72);border:1px solid var(--gold-soft);border-radius:14px;padding:20px 18px}
.domsec__msg{margin:0;font-size:14px;line-height:1.5;color:var(--ink-dim)}
.domsec__msg b{color:var(--gold-text)}
.domsec__linha{width:100%;display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;color:var(--ink-dim);border-bottom:1px solid #221d3e;padding-bottom:6px}
.domsec__linha b{font-family:'Cinzel',serif;font-size:16px;color:var(--ink)}
.domsec__sel{font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-text);border:1px solid var(--gold-soft);border-radius:12px;padding:3px 14px}
.domsec__sel--morto{color:var(--e-Chama);border-color:rgba(255,92,138,.5)}
.domsec__sel--venceu{color:var(--e-Verdejante);border-color:rgba(88,214,141,.5)}
.domtrio{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.domtrio--result{margin:4px 0}
.domficha{display:flex;flex-direction:column;align-items:center;gap:3px;width:78px}
.domficha .slot{width:44px;height:44px}
.domficha__nome{font-family:'Cinzel',serif;font-size:11px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px}
.domficha__hp{font-size:11px;font-weight:700;color:var(--e-Verdejante)}
.domficha--morto{opacity:.55}
.domficha--morto .slot{filter:grayscale(1)}
.domficha--morto .domficha__hp{color:var(--e-Chama)}
/* §365: cartões de prêmio do Domínio agora usam .dh-premio (flex-row no canvas 780×360) — o .dompremio antigo saiu */
/* §277 — TELA DE ESCOLHA em cartões-PÔSTER (reskin do mockup do dono). Bandas do §276 sobre o palco de
   428: cab 48 + respiro 8 + cartões 308 + respiro 8 + rodapé 56 = 428 (respiro SÓ entre bandas). Largura
   FLUIDA (design 780..1200) → os cartões flexionam a 5 colunas (≤172, o valor a 951). NÃO se escala o
   mockup uniformemente (1536×1024 é quase quadrado; o palco é o dobro de largo) — mantém-se a LINGUAGEM
   e as proporções INTERNAS do cartão, e o tipo escala por LEGIBILIDADE (piso do §257/§261), não pelo
   fator geométrico. Fundo por arquivo OPCIONAL: sem ele, o gradiente radial do jogo. */
:root{ --ouro-grad:linear-gradient(178deg,#FFFBEF 0%,#F6E4AE 26%,#E2C169 56%,#A97C22 84%,#F7E9B4 100%); }
/* §365 — SELEÇÃO dos 5 Domínios no canvas 780×360 (px design = px real, §357). 5 pôsteres lado a lado (148px),
   cabeçalho e rodapé "a marca a bater". Corpo ≥12, rótulos ≥11, toque ≥40, sem rolar. */
.stage.domsel2{border:0;border-radius:0;box-shadow:none;background:#03050B}
#baselayer.domsel2{position:absolute;inset:0;background:#03050B;overflow:hidden}
/* §367: marcador EM BREVE (Loja) — canvas 780×360 */
#embrevefix{position:absolute;left:50%;top:50%;width:780px;height:360px;transform-origin:center;overflow:hidden;color:var(--ink);font-family:'Rajdhani',sans-serif;background:radial-gradient(130% 90% at 50% 0%,#141026 0%,#0a0817 55%,#05040e);display:flex;flex-direction:column}
.eb__cab{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px}
.eb__voltar{min-height:40px;padding:0 14px;border:0;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;color:#E8ECF4;background:rgba(14,18,32,.9);box-shadow:inset 0 0 0 1px rgba(154,164,184,.4)}
.eb__titulo{flex:1;margin:0;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:20px;color:var(--gold-text);text-shadow:0 0 2px #000,0 1px 2px #000}
.eb__espaco{flex:none;width:92px}
.eb__corpo{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px 18px}
.eb__card{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 20px;border-radius:14px;background:rgba(10,13,26,.72);box-shadow:inset 0 0 0 1px rgba(201,164,76,.35)}
.eb__ic{font-size:46px;line-height:1;color:#C9A44C;text-shadow:0 0 8px rgba(201,164,76,.4)}
.eb__msg{margin:0;text-align:center;font-size:16px;font-weight:700;color:#EDE7FF}
.eb__sub{margin:0;text-align:center;font-size:13px;color:var(--ink-dim)}
.eb__cta{margin-top:6px;min-height:40px;padding:0 20px;border:0;border-radius:8px;cursor:pointer;font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.06em;color:#2A1A04;background:linear-gradient(180deg,#FBE29A,#E9C25A 45%,#C9962F);box-shadow:inset 0 1px 0 rgba(255,250,225,.6),0 2px 6px rgba(0,0,0,.5)}
#domselfix{position:absolute;left:50%;top:50%;width:780px;height:360px;transform-origin:center;overflow:hidden;color:var(--ink);font-family:'Rajdhani',sans-serif}
.dsel{position:absolute;inset:0;display:flex;flex-direction:column;padding:0;gap:6px;
  background:radial-gradient(120% 90% at 50% 0%,#0D1836 0%,#080E22 52%,#04070F 100%),#060B1A}
.dsel__fundo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;z-index:0}
.dsel__scrim{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 90% at 50% 0%,rgba(10,8,18,.35),rgba(10,8,18,.82) 78%)}
/* CABEÇALHO (44px) */
.dsel__cab{position:relative;z-index:2;height:44px;flex:0 0 44px;display:flex;align-items:center;gap:10px;padding:0 10px}
.dsel__voltar{flex:0 0 auto;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;border:1px solid var(--gold-soft);background:rgba(14,11,30,.7);cursor:pointer}
.dsel__voltar:hover{border-color:var(--gold-text)}
.dsel__seta{display:block;width:10px;height:10px;border-left:2px solid #F0DC9A;border-bottom:2px solid #F0DC9A;transform:rotate(45deg);margin-left:3px}
.dsel__tit{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.dsel__titlinha{display:flex;align-items:center;gap:8px}
.dsel__titulo{font-family:'Cinzel',serif;font-weight:900;font-size:20px;letter-spacing:.03em;margin:0;line-height:1;
  background:var(--ouro-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(0,0,0,.9))}
.dsel__ajuda{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(14,11,30,.5);
  box-shadow:inset 0 0 0 1.5px rgba(212,175,55,.75);color:var(--gold-text);font-family:'Cinzel',serif;font-weight:700;font-size:16px;line-height:1;cursor:pointer}
.dsel__ajuda:hover{box-shadow:inset 0 0 0 1.5px var(--gold-text)}
.dsel__sub{font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:.07em;color:#A9B6C8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsel__hist{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px;cursor:pointer;min-height:40px;
  border:1px solid var(--gold-soft);border-radius:8px;padding:4px 12px;background:rgba(14,11,30,.7);font-family:inherit;text-align:right}
.dsel__hist:hover{border-color:var(--gold-text)}
.dsel__hist-t{font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:var(--gold-text);letter-spacing:.03em}
.dsel__hist-s{font-size:12px;color:var(--ink-mute)}
/* OS CARTÕES — 5 pôsteres lado a lado (148px cada); 5×148 + vãos 8 + margens 16 = 788 ~ cabe centrado */
.dsel__cards{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:stretch;gap:8px;padding:14px 10px 0}
.dcard{position:relative;flex:1 1 0;max-width:150px;min-width:0;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.dcard__poster{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--bodyA),var(--bodyB));
  box-shadow:inset 0 0 0 2px var(--frame),inset 0 0 36px var(--glow);transition:transform .12s,filter .12s;
  clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 11px,100% calc(100% - 11px),calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px)}
.dcard:hover .dcard__poster{transform:translateY(-2px);filter:brightness(1.06)}
.dcard__art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dcard__ph{position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 20%,var(--glow),transparent 70%)}
.dcard__artveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,18,.2) 0%,rgba(6,9,18,0) 30%,var(--artFade) 100%)}
.dcard__scrim{position:absolute;inset:0;background:linear-gradient(180deg,var(--veilTop) 8%,rgba(4,6,14,.86) 30%,rgba(4,6,14,.97) 48%)}
.dcard__corpo{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 7px 8px;text-align:center}
.dcard__cult{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--tag);font-weight:700;white-space:nowrap;text-shadow:0 0 2px #04060e,0 1px 2px #04060e,0 0 6px rgba(4,6,14,.9)}
.dcard__nome{display:flex;flex-direction:column;font-family:'Cinzel',serif;font-weight:700;font-size:14px;line-height:1.1;margin-top:6px;
  background:var(--ouro-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 2px rgba(2,4,10,.95)) drop-shadow(0 0 6px rgba(2,4,10,.7))}
.dcard__frase{display:none}
.dcard__prog2{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px}
.dcard__ant{display:none}
.dcard__deuses{display:flex;justify-content:center;gap:4px;margin-top:7px}
.dcard__deus{display:flex;flex-direction:column;align-items:center;gap:1px;width:40px}
.dcard__deus .slot{width:38px;height:38px;background:#0B1226;border-radius:5px;box-shadow:inset 0 0 0 1px var(--gold-soft)}
.dcard__deus i{display:none}
.dcard__entrar{margin-top:7px;width:100%;min-height:40px;padding:0 10px;font-family:'Cinzel',serif;font-weight:700;font-size:12px;
  letter-spacing:.12em;color:#F5E9CA;background:linear-gradient(180deg,rgba(38,29,12,.9),rgba(18,14,6,.9));
  box-shadow:inset 0 0 0 1.5px rgba(232,199,101,.85);display:flex;align-items:center;justify-content:center;gap:6px;
  clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%)}
.dcard__entrar b{font-weight:700;font-size:14px}
.dcard:hover .dcard__entrar{filter:brightness(1.12)}
.dcard__emblema{position:absolute;top:-17px;left:50%;transform:translateX(-50%);z-index:3;width:38px;height:38px;
  border-radius:50%;padding:2px;background:linear-gradient(160deg,#F6E4AE,#8A6A22 52%,#5E4715 66%,#E8C765);box-shadow:0 2px 8px rgba(0,0,0,.55)}
.dcard__emblema-in{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,var(--embA),var(--embB))}
.dcard__emblema-in img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.dcard__embmono{font-family:'Cinzel',serif;font-weight:900;font-size:13px;letter-spacing:.02em;line-height:1;background:var(--ouro-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dcard--grega{--tag:#8FC4EE;--frame:rgba(120,180,240,.7);--glow:rgba(60,130,210,.2);--bodyA:rgba(8,18,38,.92);--bodyB:rgba(5,10,24,.96);--artFade:rgba(6,16,36,.9);--veilTop:rgba(6,16,36,0);--veilBottom:rgba(5,11,26,.94);--embA:#12325E;--embB:#061424}
.dcard--egípcia{--tag:#E8C765;--frame:rgba(212,175,55,.75);--glow:rgba(190,150,50,.18);--bodyA:rgba(26,18,8,.92);--bodyB:rgba(12,9,5,.96);--artFade:rgba(26,16,6,.9);--veilTop:rgba(24,16,6,0);--veilBottom:rgba(18,12,5,.94);--embA:#3A2A08;--embB:#140E03}
.dcard--chinesa{--tag:#E88A8A;--frame:rgba(212,90,70,.75);--glow:rgba(190,52,40,.2);--bodyA:rgba(28,10,12,.92);--bodyB:rgba(14,6,10,.96);--artFade:rgba(28,8,10,.9);--veilTop:rgba(24,8,10,0);--veilBottom:rgba(20,6,9,.94);--embA:#6E1418;--embB:#2A0709}
.dcard--japonesa{--tag:#E89AB4;--frame:rgba(196,80,110,.55);--glow:rgba(150,40,70,.16);--bodyA:rgba(24,10,20,.92);--bodyB:rgba(11,6,14,.96);--artFade:rgba(22,8,18,.9);--veilTop:rgba(22,8,18,0);--veilBottom:rgba(16,6,14,.94);--embA:#4A1030;--embB:#160610}
.dcard--nórdica{--tag:#BFE3F2;--frame:rgba(150,205,230,.7);--glow:rgba(90,165,205,.2);--bodyA:rgba(10,20,32,.92);--bodyB:rgba(6,12,20,.96);--artFade:rgba(8,18,30,.9);--veilTop:rgba(8,18,30,0);--veilBottom:rgba(6,13,22,.94);--embA:#1C3A4E;--embB:#08161E}
/* progresso (§275) — classes que os guardas leem */
.domcard__prog{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:10px;padding:2px 9px;border:1px solid #2c2648;color:var(--ink-dim);background:rgba(6,8,16,.45);white-space:nowrap}
.domcard__prog i{font-style:normal}
.domcard__prog--ativo{color:var(--gold-text);border-color:rgba(216,178,90,.6);background:rgba(216,178,90,.14)}
.domcard__prog--rec{color:var(--e-Verdejante);border-color:rgba(88,214,141,.4)}
.domcard__prog--novo{color:#C7D0DE}
.domcard__sup{font-style:normal;color:var(--gold-text);font-weight:800}
/* RODAPÉ: dois painéis "a marca a bater" (48px) */
.dsel__rodape{position:relative;z-index:2;flex:0 0 48px;height:48px;display:flex;gap:8px;margin:0 10px 8px}
.dsel__pain{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(180deg,rgba(12,18,38,.88),rgba(7,11,24,.88));box-shadow:inset 0 0 0 1px rgba(212,175,55,.42);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.dsel__pain--dir{justify-content:flex-end;text-align:right}
.dsel__pain-bloco{display:flex;flex-direction:column;gap:1px;min-width:0}
.dsel__pain-rot{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsel__pain-val{font-size:12px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsel__pain-val b{color:var(--gold-text);font-family:'Cinzel',serif;font-weight:700}
.dsel__pain-val i{font-style:normal;color:var(--ink-mute)}
.dsel__pain-num{font-size:13px}
.dsel__pain--vazia .dsel__pain-val{color:var(--ink-mute);white-space:normal;line-height:1.2;font-size:12px}
.dsel__pain-btn{flex:0 0 auto;margin-left:auto;font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--gold-text);background:rgba(14,11,30,.6);border:1px solid var(--gold-soft);
  border-radius:8px;padding:0 12px;min-height:40px;cursor:pointer}
.dsel__pain-btn:hover{border-color:var(--gold-text)}
/* §276 — overlay SEU HISTÓRICO */
.dhist{max-width:560px;width:92%;max-height:88%;display:flex;flex-direction:column;text-align:left}
.dhist__topo{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dhist__topo h2{font-family:'Cinzel',serif;color:var(--gold-text);margin:0;font-size:20px}
.dhist__nota{margin:0 0 12px;font-size:12px;color:var(--ink-dim);line-height:1.4}
.dhist__lista{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.dhist__linha{border:1px solid #2a2455;border-radius:10px;padding:8px 12px}
.dhist__cab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink)}
.dhist__cab b{font-family:'Cinzel',serif;color:var(--gold-text)}
.dhist__cab span{font-size:11px;color:var(--e-Verdejante)}
.dhist__semanas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dhist__wk{font-size:11px;color:var(--ink-dim);background:#1c1740;border-radius:8px;padding:2px 8px}
.dhist__wk i{font-style:normal;color:var(--ink-mute);font-size:10px}
.dhist__vazio{font-size:11px;color:var(--ink-mute)}
/* §275 — o INSTANTE da superação (linguagem do banner de ranque: ouro, brilho) */
.result--superou{border:1px solid var(--gold-text);box-shadow:0 0 40px rgba(255,217,122,.25)}
.result--superou .result__selo{color:#1a1408;background:linear-gradient(180deg,#ffe9ad,var(--gold));border-color:var(--gold)}
.result--superou h1{color:var(--gold-text)}

/* resultado da Provação (três derrotas + vitória com placar) */
.result--prova .result__selo{display:inline-block;font-family:'Cinzel',serif;font-weight:700;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);
  border:1px solid #2c2648;border-radius:12px;padding:2px 12px;margin-bottom:8px}
.result--prova h1{font-family:'Cinzel',serif;font-weight:900;letter-spacing:.06em;margin:0}
.result--venceu h1{color:var(--e-Verdejante)}
.result--hp h1,.result--prazo h1,.result--cond h1{color:var(--e-Chama)}
.result__prova{font-family:'Cinzel',serif;font-weight:600;font-size:14px;color:var(--gold-text);margin:6px 0 2px}
.result__msg{font-weight:600;font-size:13px;line-height:1.4;color:var(--ink-dim);margin:0 0 4px}
/* F4: linha de recompensa do sandbox no resultado da Batalha CPU */
.result__sandbox{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.03em;
  color:var(--gold-text);margin:2px 0 8px}
.result__sandbox--teto{color:var(--ink-mute)}
.result__placar{display:flex;flex-direction:column;align-items:center;gap:2px;margin:10px 0 4px;
  font-weight:600;font-size:13px;color:var(--ink)}
.result__placar b{color:var(--gold-text);font-size:16px}
.result__min{font-size:11px;color:var(--ink-mute);letter-spacing:.04em}
.result__rec{font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--e-Aurora)}
.result__acoes{display:flex;gap:8px;justify-content:center;margin-top:12px}

/* ===================== F3.2 — Invocação: odds visíveis, Essência ===================== */
#iv .iv-odds{background:rgba(10,8,22,.55);border:1px solid rgba(233,200,119,.18);border-radius:10px;
  padding:8px 11px;font-size:10.5px;letter-spacing:.02em;color:var(--iv-dim);text-align:center}
#iv .iv-odds b{font-variant-numeric:tabular-nums;font-weight:700}
#iv .iv-odds .iv-ssc{color:var(--iv-ss)} #iv .iv-odds .iv-sc{color:var(--iv-s)} #iv .iv-odds .iv-ac{color:var(--iv-a)}
#iv .iv-cess b{color:#c9a6ff}
#iv .iv-topo-ess{color:#d7bcff;letter-spacing:.04em;font-weight:700;text-shadow:0 0 6px rgba(0,0,0,.9),0 1px 2px rgba(0,0,0,.95)}

/* ===================== F3.2 — Coleção (por panteão) + detalhe do deus ===================== */
.csec{margin:14px 2px 4px}
.csec:first-child{margin-top:2px}
.csec__cab{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.csec__cab h2{font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold-text);margin:0}
.csec__n{font-weight:700;font-size:12px;color:var(--ink-mute)}
.cgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
@media (max-width:820px){.cgrid{grid-template-columns:repeat(5,1fr)}}
.ctile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 4px 6px;min-height:82px;cursor:pointer;border:1px solid #2c2648;border-radius:9px;
  background:rgba(20,16,38,.55);color:var(--ink);font-family:'Rajdhani',sans-serif;transition:border-color .12s,transform .08s}
.ctile:active{transform:translateY(1px) scale(.97);border-color:var(--gold-text)}
.ctile__p{width:40px;height:40px;display:grid;place-items:center}
.ctile__p .slot{width:40px;height:40px;border-radius:8px;overflow:hidden}
.ctile__el{position:absolute;left:6px;top:6px;width:4px;height:16px;border-radius:2px}
.ctile__rar{position:absolute;right:5px;top:5px;font-family:'Cinzel',serif;font-weight:700;font-size:8.5px;letter-spacing:.04em}
.ctile__lock{position:absolute;right:5px;bottom:24px;font-size:12px;color:var(--ink-mute)}
.ctile__n{font-weight:600;font-size:10px;text-align:center;line-height:1.1;color:var(--ink-dim);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctile--falta{opacity:.5;background:rgba(14,11,26,.5)}
.ctile--falta .ctile__n{color:var(--ink-mute)}
/* ---------- COLEÇÃO: a VITRINE (§216) — arte grande, moldura dourada, dois estados inequívocos ---------- */
.colgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media (max-width:700px){.colgrid{grid-template-columns:repeat(5,1fr)}}
.colx{position:relative;display:flex;flex-direction:column;cursor:pointer;padding:0;
  border:1.5px solid #2c2648;border-radius:12px;overflow:hidden;background:rgba(20,16,38,.55);
  color:var(--ink);font-family:'Rajdhani',sans-serif;transition:transform .08s,box-shadow .12s,border-color .12s}
.colx:active{transform:translateY(1px) scale(.98)}
/* QUEM VOCÊ TEM: moldura DOURADA + arte em cor (a linguagem do carrossel/batalha) */
.colx--tem{border-color:var(--gold-soft);box-shadow:0 0 0 1px rgba(255,217,122,.18),0 3px 12px rgba(0,0,0,.35)}
.colx--tem:active{border-color:var(--gold-text)}
/* QUEM FALTA: AUSÊNCIA, não indisponibilidade — cinza é legítimo (a régua do §211 não se aplica
   aqui; deus que você não tem é como o retrato do morto). Contraste forte com o que você tem. */
.colx--falta{border-style:dashed;border-color:#39335a;background:rgba(11,9,20,.62)}
.colx__rar{height:3px;width:100%;flex:0 0 auto;background:currentColor}
.colx--falta .colx__rar{opacity:.35}
.colx__art{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#14112a}
.colx__art .slot{width:100%;height:100%}
.colx__art .slot>img{border-radius:0}
.colx--falta .colx__art .slot{filter:grayscale(1) brightness(.6)}
.colx--falta .colx__art::after{content:"";position:absolute;inset:0;background:rgba(8,6,18,.4)}
/* faixa ABAIXO da arte: nome + elemento + selo (NADA cobre a ilustração) */
.colx__foot{display:flex;align-items:center;gap:5px;padding:4px 8px;min-height:23px;
  background:linear-gradient(180deg,rgba(10,8,20,.2),rgba(10,8,20,.5))}
.colx__el{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.colx__n{flex:1 1 auto;min-width:0;font-weight:600;font-size:11.5px;letter-spacing:.02em;
  color:var(--ink-mute);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colx--tem .colx__n{color:var(--ink)}
.colx__badge{flex:0 0 auto;display:flex;align-items:center}
.colx__lock{font-size:13px;color:#6a6390;line-height:1}
.colx__m{min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center;border-radius:8px;
  font-family:'Rajdhani',sans-serif;font-weight:800;font-size:10px;color:#1a1530}
.colx__m.m--1{background:#8d84ad} .colx__m.m--2{background:#7fb0e0}
.colx__m.m--3{background:#b06cff;color:#fff} .colx__m.m--4{background:var(--gold-text)}
/* §245 — a MOLDURA do MESTRE: variação de borda (cosmético, sem arte nova) — anel duplo dourado + brilho +
   cantos ornamentados. Marca o DOMÍNIO (nível 4), distinta da moldura "dourada = você tem". */
.colx--mestre{border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold-text),0 0 0 3px rgba(255,217,122,.30),0 0 15px rgba(255,190,90,.42),0 3px 12px rgba(0,0,0,.4)}
.colx--mestre .colx__art::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  border:2px solid rgba(255,224,150,.6);box-shadow:inset 0 0 0 1px rgba(255,245,210,.28)}
.colx--mestre .colx__art::after{content:"";position:absolute;inset:3px;z-index:2;pointer-events:none;
  background:
    linear-gradient(var(--gold-text),var(--gold-text)) left top/11px 2px no-repeat,
    linear-gradient(var(--gold-text),var(--gold-text)) left top/2px 11px no-repeat,
    linear-gradient(var(--gold-text),var(--gold-text)) right top/11px 2px no-repeat,
    linear-gradient(var(--gold-text),var(--gold-text)) right top/2px 11px no-repeat,
    linear-gradient(var(--gold-text),var(--gold-text)) left bottom/11px 2px no-repeat,
    linear-gradient(var(--gold-text),var(--gold-text)) left bottom/2px 11px no-repeat,
    linear-gradient(var(--gold-text),var(--gold-text)) right bottom/11px 2px no-repeat,
    linear-gradient(var(--gold-text),var(--gold-text)) right bottom/2px 11px no-repeat}
/* §245 — DESAFIOS POR DEUS: linhas por deus com a ação (comprar/jogar/desistir/recarga) */
.dsflist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.dsf{display:flex;align-items:center;gap:9px;min-height:52px;padding:6px 10px;border:1px solid #2c2648;border-radius:11px;
  background:rgba(20,16,38,.5)}
.dsf--m4{border-color:var(--gold-soft);box-shadow:0 0 0 1px rgba(255,217,122,.16)}
.dsf__p{flex:0 0 40px;width:40px;height:40px;border-radius:8px;overflow:hidden;background:#14112a;display:grid;place-items:center}
.dsf__p .slot{width:40px;height:40px}
.dsf__el{flex:0 0 8px;width:8px;height:8px;border-radius:2px}
.dsf__id{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.dsf__n{font-weight:700;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsf__maes{font-weight:600;font-size:11px;color:var(--ink-mute)}
.dsf__maes.m--4{color:var(--gold-text)}
.dsf__pe{flex:0 0 auto;display:flex;align-items:center}
.dsf__acts,.dsf__conf{display:flex;align-items:center;gap:6px}
.dsf__conf{font-size:11px;font-weight:700;color:#ff9db4}
.dsf__recarga{font-weight:700;font-size:12px;color:#8b83b8;letter-spacing:.02em}
.dsf__mestre{font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--gold-text)}
.rar--SS{color:#e9c877} .rar--S{color:#b06cff} .rar--A{color:#56a8ef}
.dcab__rar{flex:0 0 auto;font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.06em;
  border:1px solid #2c2648;border-radius:10px;padding:3px 12px}

.dhead{display:flex;gap:16px;align-items:center;padding:6px 2px 12px}
.dhead__art{flex:0 0 auto;width:96px;height:96px;border:1px solid var(--gold-soft);border-radius:12px;overflow:hidden}
.dhead__art .slot{width:96px;height:96px}
.dhead__id{display:flex;flex-direction:column;gap:8px;min-width:0}
.dhead__sub{font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.dhead__estado{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.04em}
.dhead__estado.tem{color:var(--e-Verdejante)} .dhead__estado.falta{color:var(--ink-mute)}
.dprov{border:1px solid rgba(216,178,90,.28);border-radius:10px;padding:10px 12px;margin:0 0 12px;
  background:linear-gradient(180deg,rgba(216,178,90,.06),transparent)}
.dprov__rot{font-family:'Cinzel',serif;font-weight:700;font-size:9px;letter-spacing:.2em;color:var(--ink-mute)}
.dprov__none{font-weight:600;font-size:12.5px;color:var(--ink-mute);margin:6px 0 0}
.dprov__linha{display:flex;align-items:center;gap:10px;margin-top:6px}
.dprov__niv{font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 9px;border-radius:6px;color:var(--gold-text);border:1px solid var(--gold-soft)}
.dprov__niv.niv--0{color:var(--e-Verdejante);border-color:rgba(88,214,141,.45)}
.dprov__niv.niv--2{color:var(--e-Chama);border-color:rgba(255,92,138,.45)}
.dprov__tit{flex:1 1 auto;font-family:'Cinzel',serif;font-weight:600;font-size:14px;color:var(--ink)}
.dprov__pe{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.dprov__feita{font-weight:700;font-size:12px;color:var(--e-Verdejante)}
.dprov__aberta{font-weight:700;font-size:12px;color:var(--gold-text)}

/* ===================== §358 — COLEÇÃO: grade em tela cheia, acessível (px reais no 780×360) =====================
   Canvas de design 780×360 (= o celular; fit() escala p/ cima nas telas maiores). Mínimos §357 medidos em px reais:
   corpo ≥12 · rótulo ≥11 · título ≥15 · toque ≥40×40. SEM painel lateral e SEM sobreposição: o cartão abre a FICHA.
   A GRADE é LISTA — pode rolar (lista branca §357). O resumo de raridade é UMA linha no cabeçalho. */
.col2{font-family:'Rajdhani',sans-serif;color:var(--ink);display:flex;flex-direction:column;height:100%;gap:6px;padding:6px 12px 8px;
  background:radial-gradient(120% 90% at 30% -10%,rgba(52,40,92,.5),transparent 60%),linear-gradient(180deg,#120e24,#0a0817)}
.col2__topo{flex:0 0 auto;display:flex;align-items:center;gap:12px}
.col2__voltar{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;
  background:rgba(16,13,30,.85);border:1px solid #342c54;border-radius:10px;color:var(--ink-dim)}
.col2__voltar .dsel__seta{width:10px;height:10px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:3px}
.col2__voltar:active{transform:translateY(1px) scale(.96)}
.col2__titulo{flex:0 0 auto;font-family:'Cinzel',serif;font-weight:900;font-size:22px;letter-spacing:.04em;color:var(--gold-text);margin:0}
.col2res{flex:1 1 auto;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;
  font-weight:700;font-size:13px;color:var(--ink-dim)}
.col2res__big{font-weight:800;font-size:15px;color:var(--ink)}
.col2res__big b{color:var(--gold-text)}
.col2res__r{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.col2res__rl{font-family:'Cinzel',serif;font-weight:800;font-size:13px;padding:1px 6px;border-radius:5px;border:1px solid currentColor;background:rgba(6,8,16,.82);text-shadow:0 0 2px #000,0 0 3px #000,0 1px 2px #000;}
.col2__moedas{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.col2__moeda{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;background:rgba(16,13,30,.8);box-shadow:inset 0 0 0 1px #2c2648;
  font-weight:800;font-size:13px;color:var(--ink)}
.col2__mic{font-style:normal;font-size:14px;line-height:1}
.col2__mic--ess{color:#7fb0e0} .col2__mic--gem{color:#b06cff}
/* --- filtros (modelo do montador) — toques ≥40 --- */
.col2__filtros{flex:0 0 auto;display:flex;flex-wrap:nowrap;align-items:center;gap:5px;overflow:hidden}
.col2forbes{display:inline-flex;gap:4px}
.col2forbe{width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(16,13,30,.8);box-shadow:inset 0 0 0 1px #342c54;padding:0}
.col2forbe.is-on{box-shadow:inset 0 0 0 2px var(--gold-text),0 0 8px rgba(255,217,122,.5)}
.col2ffuncs{display:inline-flex;flex-wrap:nowrap;gap:4px}
.col2fchip{cursor:pointer;height:40px;min-width:40px;padding:0 10px;border-radius:12px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;
  color:var(--ink-dim);background:rgba(20,16,38,.7);border:1px solid #2c2648}
.col2fchip.is-on{background:var(--ouro-grad);border-color:var(--gold);color:#1a1530}
.col2__busca{flex:0 1 136px;min-width:112px;display:flex;align-items:center;gap:7px;padding:0 10px;height:40px;
  background:rgba(16,13,30,.8);border:1px solid #342c54;border-radius:11px}
.col2__busca i{font-style:normal;font-size:15px;color:var(--ink-mute)}
.col2__busca input{flex:1 1 auto;min-width:0;height:40px;background:none;border:none;outline:none;color:var(--ink);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px}
.col2__busca input::placeholder{color:var(--ink-mute)}
/* --- 2ª faixa: pílulas de estado/raridade + mais + ordenar + contador --- */
.col2__pills{flex:0 0 auto;display:flex;flex-wrap:nowrap;align-items:center;gap:6px;overflow:hidden}
.col2pill__grp{display:inline-flex;gap:0;border-radius:11px;overflow:hidden;box-shadow:inset 0 0 0 1px #342c54}
.col2pill{cursor:pointer;height:40px;min-width:40px;padding:0 9px;border:0;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;
  color:var(--ink-dim);background:rgba(16,13,30,.8)}
.col2pill.is-on{background:var(--ouro-grad);color:#1a1530}
.col2__sel{position:relative;display:flex;align-items:center}
.col2__sel select{appearance:none;-webkit-appearance:none;height:40px;padding:0 24px 0 10px;cursor:pointer;
  background:rgba(16,13,30,.8);border:1px solid #342c54;border-radius:11px;color:var(--ink);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-mute) 50%),linear-gradient(135deg,var(--ink-mute) 50%,transparent 50%);
  background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.col2__conta{font-weight:700;font-size:13px;color:var(--ink-mute);white-space:nowrap;margin-left:auto;padding:0 2px}
.col2mf__abre.is-on{background:var(--ouro-grad);border-color:var(--gold);color:#1a1530}
/* --- GRADE (tela cheia, rola) --- */
.col2__grade{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 4px 4px 2px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:90px;gap:7px;justify-content:start;align-content:start;scrollbar-width:thin}
.col2__grade::-webkit-scrollbar{width:7px} .col2__grade::-webkit-scrollbar-thumb{background:#3a3360;border-radius:3px}
.col2__vazio{grid-column:1/-1;padding:24px 8px;text-align:center;font-weight:600;font-size:13px;color:var(--ink-mute)}
/* --- CARTÃO (retrato cheio + rodapé) — abre a FICHA --- */
.col2c{position:relative;width:100%;height:90px;padding:0;cursor:pointer;overflow:hidden;color:var(--ink);
  font-family:'Rajdhani',sans-serif;background:#0A0E1C;border:0;border-radius:10px;transition:transform .08s}
.col2c:active{transform:translateY(1px) scale(.98)}
.col2c::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:10px;box-shadow:inset 0 0 0 1.5px rgba(201,164,76,.25)}
.col2c--tem::after{box-shadow:inset 0 0 0 1.5px rgba(201,164,76,.45)}
.col2c__art{position:absolute;inset:0;z-index:0}
.col2c__art .slot{width:100%;height:100%}
.col2c__art .slot>img{border-radius:0;object-fit:cover}
.col2c--falta .col2c__art .slot{filter:grayscale(1) brightness(.55)}
.col2c--falta{background:rgba(11,9,20,.7)}
.col2c__grad{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,8,16,0),rgba(6,8,16,.93))}
.col2c--falta .col2c__grad{background:linear-gradient(180deg,rgba(6,8,16,.3),rgba(6,8,16,.95))}
.col2c__rar{position:absolute;top:5px;right:5px;z-index:3;min-width:20px;height:18px;padding:0 5px;display:grid;place-items:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:12px;color:#1a1530;border-radius:5px}
.col2c__rar--SS{background:#e9c877} .col2c__rar--S{background:#c79bff;color:#241038} .col2c__rar--A{background:#7cc0f5;color:#0e2338}
.col2c--falta .col2c__rar{opacity:.55}
.col2c__cult{position:absolute;top:5px;left:5px;z-index:3;min-width:20px;height:18px;padding:0 5px;display:grid;place-items:center;
  font-weight:800;font-size:12px;line-height:1;color:var(--gold-text);background:rgba(10,13,22,.85);border-radius:5px;box-shadow:inset 0 0 0 1px rgba(201,164,76,.4)}
.col2c--falta .col2c__cult{color:var(--ink-mute);box-shadow:inset 0 0 0 1px rgba(120,120,150,.35)}
.col2c__subir{position:absolute;top:27px;left:5px;z-index:3;width:18px;height:18px;display:grid;place-items:center;
  font-size:11px;font-weight:900;line-height:1;color:#1a1530;background:var(--ouro-grad);border-radius:50%;box-shadow:0 0 7px rgba(255,217,122,.6)}
.col2c__foot{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;gap:2px;padding:0 8px 7px;text-align:left}
.col2c__n{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.01em;color:#F7EEDC;line-height:1.08;
  word-break:normal;overflow-wrap:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 2px #000,0 0 3px #000}
.col2c--falta .col2c__n{color:#C9CED8}
.col2c__meta{display:flex;align-items:center;gap:5px;min-width:0}
.col2c__meta .orbe{flex:none}
.col2c__f{font-weight:600;font-size:12px;letter-spacing:.02em;color:#D5DAE4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* --- "MAIS FILTROS" (painel sobreposto; reusa .fbox/.fgrp/.chip2 do §345) --- */
.col2mf{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,5,11,.72);backdrop-filter:blur(2px)}
.col2mf__box{max-width:560px;max-height:100%}
.col2mf__b{cursor:pointer;height:40px;padding:0 16px;border-radius:9px;font-family:'Rajdhani',sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em}
.col2mf__b--quiet{background:rgba(30,24,54,.7);border:1px solid #342c54;color:var(--ink-dim)}
.col2mf__b--go{background:var(--ouro-grad);border:1px solid var(--gold);color:#1a1530}

/* ===================== F3.3 — Campanha (trilha de encontros + HUD de lição) ===================== */
.ccap{margin:4px 2px 12px}
.ccap h2{font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--gold-text);margin:0}
.ccap p{font-weight:600;font-size:12.5px;line-height:1.4;color:var(--ink-dim);margin:4px 0 0}
.clista{display:flex;flex-direction:column;gap:9px}
.cenc{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:62px;cursor:pointer;width:100%;
  text-align:left;font-family:'Rajdhani',sans-serif;color:var(--ink);
  background:rgba(20,16,38,.6);border:1px solid #2c2648;border-radius:11px;transition:border-color .12s,transform .08s}
.cenc:active:not(:disabled){transform:translateY(1px) scale(.995);border-color:var(--gold-text)}
.cenc__ic{flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;font-family:'Cinzel',serif;
  font-weight:900;font-size:16px;color:var(--gold-text);border:1px solid var(--gold-soft);border-radius:8px}
.cenc__id{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.cenc__nome{font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:.03em;color:var(--ink)}
.cenc__chefe{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:9px;letter-spacing:.1em;color:var(--e-Chama);
  border:1px solid rgba(255,92,138,.5);border-radius:8px;padding:1px 6px;margin-left:4px}
.cenc__ensina{font-weight:600;font-size:11.5px;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cenc__pe{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.cenc__rec{font-weight:700;font-size:12px;color:var(--gold-text);font-variant-numeric:tabular-nums}
.cenc__estado{font-family:'Cinzel',serif;font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute)}
.cenc--feito{opacity:.7;border-style:dashed}
.cenc--feito .cenc__ic{color:var(--e-Verdejante);border-color:rgba(88,214,141,.45)}
.cenc--travado{opacity:.5;cursor:default;background:rgba(14,11,26,.5)}
.cenc--travado .cenc__ic{color:var(--ink-mute);border-color:#262138}
.cenc--aberto{border-color:var(--gold-soft)}
.cmontarpe{flex:0 0 auto;display:flex;justify-content:center;padding:10px 24px 16px;border-top:1px solid rgba(216,178,90,.15)}
.ctile--sel{border-color:var(--gold-text);box-shadow:0 0 0 1px rgba(255,217,122,.4)}
.ctile__mark{position:absolute;left:5px;bottom:24px;width:16px;height:16px;display:grid;place-items:center;
  font-family:'Cinzel',serif;font-weight:900;font-size:10px;color:#201604;background:var(--gold-text);border-radius:50%}

/* ===================== §253 — CAMPANHA NARRATIVA (visual do mockup aprovado) ===================== */
/* Mockup 1170×540 → palco 951×428 (fator .7926). Y/alturas FIXOS (o palco tem sempre 428);
   X/larguras ancorados/percentuais (a largura flui 780–1200; batem o mockup em 951 e absorvem
   os 24px de folga na arte e no painel). Toda função do §252 preservada (só a pele muda). */
/* §364: CAMPANHA no canvas 780×360 (px de design = px real). Acessível (§357): corpo ≥12, rótulo ≥11, título ≥15,
   toque ≥40×40, SEM rolar em nenhum lugar. Colunas por tipo: batalha dá mais largura ao painel (direita busy);
   escolha/história dão mais à ESQUERDA (o texto da história é longo — até 819 chars). Cabeçalho 46, trilha 56. */
.stage.campfix2{border:0;border-radius:0;box-shadow:none;background:#03050B}
#baselayer.campfix2{position:absolute;inset:0;background:#03050B;overflow:hidden}
#campfix{position:absolute;left:50%;top:50%;width:780px;height:360px;transform-origin:center;overflow:hidden;color:var(--ink);font-family:'Rajdhani',sans-serif}
.camp{position:absolute;inset:0;overflow:hidden;--artw:320px;
  background:radial-gradient(76% 96% at 80% 42%,#0D1836 0%,#080E22 48%,#04070F 100%),#060B1A}
.camp--escolha{--artw:460px}   /* §364: ESCOLHA vista 'texto' = esquerda larga p/ a história (até 819c, paginada) + teaser à direita */
.camp--escolhaop{--artw:240px} /* §364: ESCOLHA vista 'opções' = painel LARGO full-width (pista de 86c cabe em 1 linha); cab largo o bastante p/ o logo não entrar sob o capbox */
.camp--historia{--artw:540px}
/* --- ESQUERDA: arte + legenda (rótulo do ato + título + TEXTO inteiro, sem rolar) --- */
.camp__arte{position:absolute;left:0;top:46px;bottom:58px;width:var(--artw);overflow:hidden;background:#0c0a1c}
.camp__arteimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camp__artefallback{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 28%,rgba(42,34,78,.6),rgba(8,6,18,.96))}
.camp__phorn{font-size:46px;color:var(--gold-soft);opacity:.5}
.camp__veu1{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,15,.92) 0%,rgba(4,6,15,.78) 20%,rgba(4,6,15,.82) 40%,rgba(4,6,15,.95) 64%,rgba(4,6,15,.99) 100%)}
.camp__veu2{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,6,15,0) 62%,rgba(6,11,26,.92) 100%)}
.camp__legenda{position:absolute;left:14px;right:12px;top:10px;bottom:10px;display:flex;flex-direction:column;gap:5px}
.camp__num{font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.18em;color:#D7BE7E;white-space:nowrap}
.camp__nome{margin:0;font-family:'Cinzel',serif;font-weight:900;font-size:18px;line-height:1.1;
  background:linear-gradient(178deg,#FFF9E6 0%,#F2DFA2 32%,#D4AF37 66%,#A97C22 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(0,0,0,.95))}
.camp__filete{width:44px;height:2px;flex:none;background:linear-gradient(90deg,rgba(212,175,55,.9),rgba(212,175,55,.1))}
.camp__texto{margin:0;font-size:12px;font-weight:500;line-height:1.3;color:#CFD9EA;flex:1 1 auto;min-height:0;overflow:hidden;text-shadow:0 1px 3px rgba(0,0,0,.9)}
/* §364 — paginação do texto longo (sem rolar/cortar): ‹ i/n › com toque ≥40. */
.camp__pag{display:flex;align-items:center;justify-content:center;gap:10px;flex:none;margin-top:2px}
.camp__pagb{width:40px;height:40px;flex:none;border:0;border-radius:6px;cursor:pointer;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(212,175,55,.45);color:#E8C765;font-family:'Cinzel',serif;font-size:18px;line-height:1}
.camp__pagb:disabled{opacity:.35;cursor:default}
.camp__pagn{font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.06em;color:#B9C7DE}
/* --- CABEÇALHO (esquerda: INÍCIO + CAMPANHA) --- */
.camp__cab{position:absolute;left:0;top:0;width:var(--artw);height:46px;z-index:3;display:flex;align-items:center;gap:10px;padding-left:12px;
  background:linear-gradient(180deg,rgba(4,7,17,.96) 0%,rgba(4,7,17,.6) 70%,rgba(4,7,17,0) 100%)}
.camp__inicio{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:0;border-radius:5px;cursor:pointer;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(212,175,55,.5);
  font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.12em;color:#E8D7AA}
.camp__chev{width:6px;height:6px;border-left:2px solid #E8C765;border-bottom:2px solid #E8C765;transform:rotate(45deg)}
.camp__filetev{width:1px;height:22px;background:linear-gradient(180deg,rgba(212,175,55,0),rgba(212,175,55,.6),rgba(212,175,55,0))}
.camp__logo{margin:0;font-family:'Cinzel',serif;font-weight:900;font-size:19px;line-height:1.1;letter-spacing:.06em;
  background:linear-gradient(178deg,#FFF9E6 0%,#F2DFA2 30%,#D4AF37 60%,#9A6F1E 86%,#F7E9B4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(60,38,4,.7))}
/* --- CABEÇALHO (direita: capítulo + navegação) --- */
.camp__capbox{position:absolute;right:0;top:0;left:var(--artw);height:46px;z-index:3;
  background:linear-gradient(180deg,#0C1732 0%,#0A1228 100%);box-shadow:inset 0 -1px 0 rgba(212,175,55,.42)}
.camp__capinner{position:absolute;right:8px;left:8px;top:0;height:100%;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.camp__capnav{flex:none;width:40px;height:40px;background:rgba(255,255,255,.05);border:0;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(212,175,55,.4);color:#E8C765;font-size:20px;cursor:pointer;font-family:'Cinzel',serif;line-height:1}
.camp__capid{min-width:0;display:flex;flex-direction:column;align-items:flex-end;text-align:right;line-height:1.12}
.camp__capeye{font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.14em;color:#8FA0BC;white-space:nowrap}
.camp__captit{font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.02em;color:#F0DC9A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.camp__capep{display:none}
.camp__prog{flex:none;font-family:'Cinzel',serif;font-weight:700;font-size:18px;color:#FFF3C4;white-space:nowrap}
.camp__progt{font-weight:400;font-size:12px;color:#7E8FA8;margin-left:1px}
/* --- PAINEL DE BRIEFING (direita) — ancorado base acima da trilha; a CTA fica FORA do miolo (§356). --- */
.camp__brief{position:absolute;top:50px;bottom:60px;left:calc(var(--artw) + 6px);right:8px;border-radius:5px;padding:7px;z-index:2;
  background:linear-gradient(180deg,rgba(12,21,45,.92) 0%,rgba(7,12,28,.95) 100%);
  box-shadow:inset 0 0 0 1px rgba(212,175,55,.34),0 10px 30px rgba(0,0,0,.55);
  display:flex;flex-direction:column;gap:5px;overflow:hidden}
.camp__lbl{font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.camp__lbl--voce{color:#D7BE7E}
.camp__lbl--inim{color:#B5A2D8;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.camp__lbl--rec{color:#D7BE7E}
.camp__form{font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.08em;color:#8E82B2}
/* §364: o miolo NÃO rola (§357) — tudo cabe na altura fixa. A CTA fica FORA do miolo, ancorada embaixo (§356). */
.camp__briefrol{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.camp__elencos{display:flex;gap:8px}
.camp__col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px}
.camp__slots,.camp__inims{display:flex;gap:5px}
.cslot{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;overflow:hidden;border-radius:4px;background:#0f0c20;
  box-shadow:inset 0 0 0 1px rgba(212,175,55,.3);border:0;padding:0;color:var(--ink)}
.cslot__p{width:100%;height:40px;display:grid;place-items:center}
.cslot__p .slot{width:100%;height:100%;border-radius:0}
.cslot__nome{font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:.02em;color:#EFE3C6;text-align:center;padding:2px 2px;
  background:linear-gradient(0deg,rgba(8,5,20,.96),rgba(8,5,20,.25));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cslot__badge{position:absolute;top:2px;right:2px;width:18px;height:18px;display:grid;place-items:center;border-radius:4px;font-size:12px;line-height:1}
.cslot__lock{background:rgba(6,5,16,.82);color:#E8C765}
.cslot--trav{box-shadow:inset 0 0 0 1.5px rgba(232,199,101,.7)}
.cslot--empr{cursor:pointer}
.cslot__swap{background:#E8C765;color:#0f0c20;font-weight:900}
.cslot--empr:active{transform:translateY(1px)}
.cslot--vazio{align-items:center;justify-content:center;min-height:56px;cursor:pointer;border:1px dashed rgba(212,175,55,.4);box-shadow:none}
.cslot--vazio .cslot__p{aspect-ratio:auto;font-family:'Cinzel',serif;font-weight:900;font-size:20px;color:var(--gold-soft)}
.cslot--vazio .cslot__nome{background:none;color:var(--gold-soft);font-size:12px}
.cinim{position:relative;flex:1 1 0;min-width:0;height:40px;border-radius:4px;overflow:hidden;background:#120C28;box-shadow:inset 0 0 0 1px rgba(150,110,220,.5)}
.cinim__p{position:absolute;inset:0;display:grid;place-items:center}
.cinim__p .slot{width:100%;height:100%;border-radius:0}
.cinim__nome{position:absolute;left:0;right:0;bottom:0;height:17px;display:flex;align-items:center;justify-content:center;padding:0 2px;
  background:linear-gradient(0deg,rgba(8,5,20,.96),rgba(8,5,20,.25));
  font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:-.3px;color:#E4DBF4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp__divisor{height:1px;flex:0 0 auto;background:linear-gradient(90deg,rgba(212,175,55,0),rgba(212,175,55,.26) 24%,rgba(212,175,55,.26) 76%,rgba(212,175,55,0))}
.camp__mec{display:flex;align-items:flex-start;gap:8px}
.camp__mecico{flex:0 0 auto;width:28px;height:28px;display:grid;place-items:center;border-radius:5px;background:#151C46;box-shadow:inset 0 0 0 1px rgba(150,190,255,.42);font-size:15px}
.camp__mectxt{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px}
.camp__mectoprow{display:flex;align-items:baseline;gap:7px}
.camp__mectit{font-family:'Cinzel',serif;font-weight:700;font-size:12px;color:#F2E6C4}
.camp__mecselo{font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#7FB0E0;white-space:nowrap}
.camp__mecdica{font-size:12px;line-height:1.22;color:#9FB0CC}
.camp__rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.camp__reccab{display:flex;align-items:center;gap:7px;flex:none}
.camp__coletada{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--e-Verdejante)}
.camp__recchips{display:flex;gap:6px;flex-wrap:wrap}
.crec{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:4px;background:rgba(255,255,255,.05)}
.crec__v{font-size:13px;font-weight:700;color:#F2F4F8}
.crec__u{font-size:12px;font-weight:600;letter-spacing:.06em;color:#9AA7BE}
.crec--feita{opacity:.5}
.camp__cta{position:relative;margin-top:auto;flex:0 0 auto;height:40px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(180deg,#5C4213 0%,#33240A 100%);box-shadow:0 0 24px rgba(212,175,55,.22);
  clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,13px 100%,0 50%);
  font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.1em;color:#FFF6DC}
.camp__cta::after{content:'';position:absolute;inset:0;clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,13px 100%,0 50%);box-shadow:inset 0 0 0 1px rgba(240,220,154,.85);pointer-events:none}
.camp__ctaseta{width:0;height:0;border-left:11px solid #FFF3C4;border-top:7px solid transparent;border-bottom:7px solid transparent}
.camp__cta:active{transform:translateY(1px)}
.camp__cta:disabled{background:linear-gradient(180deg,#2a2740,#1e1c30);color:#8EA0BC;box-shadow:none;cursor:default}
.camp__cta:disabled::after{box-shadow:inset 0 0 0 1px rgba(150,170,200,.25)}
.camp__cta:disabled .camp__ctaseta{border-left-color:#8EA0BC}
/* HISTÓRIA: texto central + CONTINUAR (a CTA fora do miolo, §356). */
.camp__brief--hist .camp__briefrol{align-items:center;justify-content:center;text-align:center;gap:12px}
.camp__historn{font-size:34px;color:var(--gold-soft)}
.camp__histnota{margin:0;font-size:12px;color:#8FA0BC}
/* ESCOLHA: pergunta + opções inteiras, tocáveis, sem rolar. */
.camp__brief--escolha{gap:8px}
.camp__perg{font-family:'Cinzel',serif;font-weight:700;font-size:14px;line-height:1.24;letter-spacing:.01em;color:#F0DC9A;flex:none}
.camp__opcoes{flex:1 1 auto;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
/* §364 — ESCOLHA em 2 páginas (o dono autorizou dividir p/ não rolar/cortar): vista 'texto' = história paginada + teaser;
   vista 'opções' = painel FULL-WIDTH (pista de 86c cabe em 1 linha) com pergunta, opções inteiras e CTA, acima da trilha. */
.camp__escwrap{position:absolute;left:8px;right:8px;top:46px;bottom:56px;z-index:2;display:flex;flex-direction:column;gap:4px}
.camp__escwrap .camp__perg{flex:none;min-width:0;margin:0}
.camp__escwrap .camp__opcoes{flex:1 1 auto;min-height:0;gap:2px}
.camp__escbar{flex:none;display:flex;align-items:stretch;gap:8px;height:40px}
.camp__escbar .camp__cta{flex:1 1 auto;height:40px;margin-top:0}
.camp__reler{flex:none;min-height:40px;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border:0;border-radius:6px;cursor:pointer;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(212,175,55,.45);color:#E8D7AA;font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.06em}
.camp__reler:active{transform:translateY(1px)}
/* teaser da vista 'texto': rótulo A ESCOLHA + pergunta + nota, com a CTA "Ver as opções" fora do miolo (§356). */
.camp__brief--escteaser .camp__briefrol{gap:10px}
.camp__escnop{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;color:#8FA0BC}
.copc{display:flex;align-items:center;gap:9px;text-align:left;padding:4px 9px;border:0;border-radius:5px;cursor:pointer;color:var(--ink);min-height:40px;
  background:rgba(12,10,32,.6);box-shadow:inset 0 0 0 1px rgba(150,170,200,.22)}
.copc:active{transform:translateY(1px)}
.copc__disco{flex:0 0 auto;width:34px;height:34px;border-radius:4px;overflow:hidden;display:grid;place-items:center;background:#0f0c20}
.copc__disco .slot{width:100%;height:100%;border-radius:0}
.copc__mono{font-family:'Cinzel',serif;font-weight:900;font-size:15px;color:var(--gold-soft)}
.copc__corpo{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px}
.copc__rot{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.02em;color:#EFE3C6}
.copc__pista{font-size:13px;line-height:1.2;color:#9FB0CC}
.copc__mark{flex:0 0 auto;font-size:14px;color:#8290A8;text-shadow:0 0 2px #000,0 0 3px #000,0 1px 2px #000;}
.copc--sel{box-shadow:inset 0 0 0 1.5px #E8C765,0 0 16px rgba(212,175,55,.22);background:rgba(46,36,12,.5)}
.copc--sel .copc__mark{color:#F0DC9A}
.copc--trava{opacity:.42;cursor:default}
.copc--trava.copc--sel{opacity:1}
/* revelação da consequência no ato-alvo. */
.camp__revel{display:flex;flex-direction:column;gap:2px;padding:4px 8px;border-radius:5px;background:rgba(46,36,12,.34);box-shadow:inset 0 0 0 1px rgba(212,175,55,.3)}
.camp__revell{margin:0;font-family:'Cinzel',serif;font-weight:500;font-size:12px;line-height:1.24;color:#E5CE94;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* §364 — KIT REVELADO em UMA linha de nomes tocáveis ("Kit revelado: Hel · Fenrir"), cada nome ≥40 de toque. */
.camp__kitline{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;min-height:40px}
.camp__kitlinelbl{font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#C8B4F0}
.camp__kitname{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 10px;border:0;border-radius:6px;cursor:pointer;color:#E7DCFA;
  background:rgba(18,12,40,.75);box-shadow:inset 0 0 0 1px rgba(150,110,220,.55);font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.02em}
.camp__kitname:active{transform:translateY(1px)}
.camp__kitnamep{flex:none;width:22px;height:22px;border-radius:4px;overflow:hidden;display:grid;place-items:center}
.camp__kitnamep .slot{width:100%;height:100%;border-radius:0}
.camp__kitrevlist{display:flex;flex-direction:column;gap:7px;overflow-y:auto;overscroll-behavior:contain}
/* --- RODAPÉ: trilha (navegação) — nós ≥40 de toque, nomes ≥11 em 2 linhas. --- */
.camp__pe{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:3;
  background:linear-gradient(180deg,rgba(8,13,30,.9) 0%,#070B1C 44%,#050813 100%);box-shadow:inset 0 1px 0 rgba(212,175,55,.3)}
.camp__guia{position:absolute;left:24px;right:24px;top:17px;height:1px;background:rgba(150,170,200,.16)}
.camp__guiafill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#E8C765,rgba(212,175,55,.35))}
.camp__nos{position:absolute;left:6px;right:6px;top:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-start}
.cnode{flex:1 1 0;min-width:40px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px 0;cursor:pointer;background:none;border:0;overflow:hidden}
.cnode__d{position:relative;width:22px;height:22px;flex:none;transform:rotate(45deg);display:grid;place-items:center;background:rgba(14,22,46,.9);box-shadow:inset 0 0 0 1px rgba(150,170,200,.3)}
.cnode__num,.cnode__lock{transform:rotate(-45deg);font-family:'Cinzel',serif;font-weight:700;font-size:12px;color:#B7C3D6;line-height:1;text-shadow:0 0 2px #000,0 0 3px #000,0 1px 2px #000;}
/* §364: nomes dos atos SEM caixa-alta (minúsculas são mais estreitas) p/ caber em 2 linhas sem corte — o mais longo tem 35c ("Alianças, conflitos e oportunidades"). */
.cnode__nome{width:100%;font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:-.3px;color:#97A6BE;text-align:center;line-height:1.0;text-shadow:0 0 2px #000,0 0 3px #000,0 1px 2px #000;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cnode--feito .cnode__d{background:linear-gradient(160deg,#2E6FB0,#0F2E58);box-shadow:0 0 0 1.5px rgba(232,199,101,.75)}
.cnode--feito .cnode__num{color:#FFF9E6}
.cnode--feito .cnode__nome{color:#B7A56E}
.cnode--atual .cnode__d{background:linear-gradient(160deg,#2E6FB0,#0F2E58);box-shadow:0 0 0 1.5px #E8C765,0 0 14px rgba(212,175,55,.45)}
.cnode--atual .cnode__num{color:#FFF9E6}
.cnode--atual .cnode__nome{font-weight:700;color:#F0DC9A}
.cnode--travado{cursor:default}
.cnode--t-historia .cnode__d{transform:rotate(0deg);border-radius:50%}
.cnode--t-historia .cnode__num,.cnode--t-historia .cnode__lock{transform:none}
.cnode--t-escolha .cnode__d::after{content:'';position:absolute;left:-1px;right:-1px;top:50%;height:1.5px;margin-top:-.75px;background:#7FD4FF;box-shadow:0 0 5px rgba(120,200,255,.75)}
/* seletor de troca do emprestado (reusa .ov/.ovbox/.ctile) */
.ov__cab{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ov__cab h2{margin:0;font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:.1em;color:var(--gold-text)}
.ov__cab .push,.ov__cab .b{margin-left:auto}
.cgrid.cgrid--pick{grid-template-columns:repeat(8,1fr);gap:7px;max-height:260px;overflow-y:auto;overscroll-behavior:contain}

/* ===================== F3.4 — banner da Provação da Semana (topo da lista) ===================== */
.psem{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  padding:12px 15px;margin:2px 0 14px;font-family:'Rajdhani',sans-serif;color:var(--ink);
  background:linear-gradient(110deg,rgba(216,178,90,.16),rgba(20,16,38,.6) 60%);
  border:1px solid var(--gold);border-radius:12px;box-shadow:0 0 0 1px rgba(216,178,90,.2),0 8px 22px rgba(0,0,0,.4);
  transition:transform .08s,border-color .12s}
.psem:active{transform:translateY(1px) scale(.995)}
.psem__p{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center}
.psem__p .slot{width:40px;height:40px;border-radius:8px;overflow:hidden}
.psem__id{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.psem__rot{font-family:'Cinzel',serif;font-weight:700;font-size:10px;letter-spacing:.16em;color:var(--gold-text)}
.psem__rot b{color:var(--ink)}
.psem__tit{font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psem__foe{font-weight:600;font-size:11.5px;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psem__pe{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.psem__rec{font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--gold-text)}
.psem__go{font-family:'Cinzel',serif;font-weight:900;font-size:16px;color:var(--gold-text)}

/* ===================== F3.5 — Maestria (título/cosmético) e panteão por proporção ===================== */
