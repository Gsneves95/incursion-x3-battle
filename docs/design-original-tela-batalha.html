<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tela de Batalha — 3v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TELA DE BATALHA — 3v3, 4 habilidades, 6 energias
   Canvas fixo 926x428 (celular horizontal), escalado por JS.
   Troque os .slot por <img> reais. Estados por classe:
   .is-down (derrotado), .is-cooldown (habilidade em recarga),
   .is-active (unidade/linha ativa).
   ============================================================ */
:root{
  --bg:#07060f; --panel:rgba(24,20,44,.94); --panel-2:rgba(12,10,26,.94);
  --gold:#d8b25a; --gold-soft:#8a6b2f; --gold-text:#ffd97a;
  --ink:#e3ddf7; --ink-dim:#a99cd0; --ink-mute:#7d78a0;
  --enemy:#e0607f; --danger:#ff3b3b;
  --hp-ok-1:#7ff0a5; --hp-ok-2:#2f9d5c; --hp-warn-1:#ffd97a; --hp-warn-2:#d8853a;
  --e-solar:#ffc94a; --e-lunar:#9fd8ff; --e-vital:#58d68d;
  --e-caos:#ff5c8a; --e-vazio:#a06bff; --e-tempestade:#4ad3c7;
  --stage-w:926px; --stage-h:428px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05040c;overflow:hidden}
body{font-family:'Rajdhani',sans-serif;color:var(--ink);display:grid;place-items:center}
a{color:#63e6ff;text-decoration:none}
a:hover{color:var(--gold-text)}

#viewport{width:100vw;height:100vh;display:grid;place-items:center}
.stage{position:relative;width:var(--stage-w);height:var(--stage-h);overflow:hidden;
  background:var(--bg);border:1px solid #2a2440;border-radius:10px;transform-origin:center}
.stage__bg{position:absolute;inset:0;background:url('uploads/VERSO%20TODOS%20OS%20DOMINIOS.png') center/cover no-repeat}
.stage__scrim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,rgba(10,9,25,.15) 0%,rgba(6,5,16,.72) 100%)}

/* placeholder de imagem — substitua por <img class="slot"> */
.slot{width:100%;height:100%;display:block;object-fit:cover;
  background:#14112a url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="%234a3f72" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-2 4 3"/></svg>') center/22px no-repeat}

/* ---------- TOPO ---------- */
.topbar{position:absolute;top:0;left:0;right:0;height:62px;display:flex;align-items:center;
  justify-content:space-between;padding:0 10px;
  background:linear-gradient(180deg,rgba(9,8,20,.94) 0%,rgba(9,8,20,.62) 78%,rgba(9,8,20,0) 100%)}
.player{display:flex;align-items:center;gap:8px}
.player__avatar{width:38px;height:38px;border:1px solid var(--gold-soft);border-radius:4px;overflow:hidden}
.player--enemy .player__avatar{border-color:#8a4a5c}
.player__meta{display:flex;flex-direction:column;gap:1px}
.player--enemy .player__meta{align-items:flex-end}
.player__name{font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--gold-text);line-height:1}
.player--enemy .player__name{color:#ff8fae}
.player__rank{font-size:12px;font-weight:600;letter-spacing:.1em;color:#b9aee0;line-height:1}

.turnbox{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:8px}
.timer{position:relative;width:300px;height:14px;border:1px solid var(--gold-soft);border-radius:3px;background:#120f24;overflow:hidden}
.timer__fill{position:absolute;inset:0;width:62%;background:linear-gradient(180deg,#ffd97a,#d8853a)}
.timer__label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:10px;letter-spacing:.1em;word-spacing:.2em;color:#0a0912}
.energy{display:flex;gap:5px}
.energy__pill{display:flex;align-items:center;gap:3px;background:rgba(9,8,20,.7);border:1px solid #3a3158;border-radius:3px;padding:1px 4px}
.energy__dot{width:11px;height:11px;border:1px solid #0a0912;display:block}
.energy__n{font-weight:700;font-size:12px;color:#fff}

/* ---------- TIMES ---------- */
.team{position:absolute;top:64px;display:flex;flex-direction:column}
.team--ally{left:8px;gap:6px}
.team--enemy{right:8px;gap:10px;align-items:flex-end}

.unit{display:flex;align-items:flex-end;gap:7px}
.unit__portrait{display:flex;flex-direction:column;gap:2px;width:64px}
.portrait{position:relative;width:64px;height:56px;border:1px solid var(--gold);border-radius:4px;
  overflow:hidden;background:#14112a;box-shadow:0 0 0 1px #0a0912,0 4px 10px rgba(0,0,0,.6)}
.team--enemy .portrait{border-color:var(--enemy)}
.portrait.is-down{border-color:#5a4f7a;box-shadow:none}
.portrait.is-down .slot{filter:grayscale(1) brightness(.55)}
.portrait__x{display:none;position:absolute;inset:0;pointer-events:none}
.portrait.is-down .portrait__x{display:block}
.portrait__x::before,.portrait__x::after{content:"";position:absolute;left:50%;top:50%;width:132%;height:3px;
  background:var(--danger);box-shadow:0 0 6px rgba(0,0,0,.8)}
.portrait__x::before{transform:translate(-50%,-50%) rotate(45deg)}
.portrait__x::after{transform:translate(-50%,-50%) rotate(-45deg)}

.hp{position:relative;height:12px;border:1px solid #0a0912;border-radius:2px;background:#3a1c22;overflow:hidden}
.hp__fill{position:absolute;inset:0;background:linear-gradient(180deg,var(--hp-ok-1),var(--hp-ok-2))}
.hp--warn .hp__fill{background:linear-gradient(180deg,var(--hp-warn-1),var(--hp-warn-2))}
.hp--empty{background:#2a2440}
.hp__label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9)}
.hp--empty .hp__label{color:#cfc8ea}

.unit__side{display:flex;flex-direction:column;gap:3px}
.effects{display:flex;align-items:flex-end;gap:3px;height:20px;padding-left:2px}
.effect{position:relative;width:20px;height:20px;border:1px solid var(--gold);border-radius:2px;overflow:hidden;background:#14112a}
.effect--buff{border-color:#63e6ff}
.effect--debuff{border-color:var(--e-caos)}
.effect__turns{position:absolute;right:0;bottom:0;min-width:9px;padding:0 1px;background:rgba(6,5,16,.85);
  font-weight:700;font-size:9px;line-height:10px;color:var(--gold-text);text-align:center}

.skills{display:flex;gap:5px;padding:5px;border:1px solid var(--gold-soft);border-radius:5px;
  background:linear-gradient(180deg,var(--panel),var(--panel-2))}
.skill{position:relative;width:54px;height:54px;border:1px solid var(--gold);border-radius:3px;
  overflow:hidden;background:#14112a;cursor:pointer}
.skill.is-cooldown{border-color:#6a5a3a;cursor:default}
.skill__cd{display:none;position:absolute;inset:0;background:rgba(6,5,16,.72);align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:900;font-size:26px;color:var(--gold-text);pointer-events:none}
.skill.is-cooldown .skill__cd{display:flex}
.skills--empty{width:245px;height:68px;border:0;background:none;padding:0}

.unit--enemy{display:flex;align-items:flex-start;gap:6px}
.unit--enemy .effects{height:auto;padding:2px 0 0}
.unit--enemy .effect{width:14px;height:14px}

/* ---------- RODAPÉ ---------- */
.footer{position:absolute;bottom:0;left:0;right:0;height:94px;display:flex;align-items:stretch;gap:10px;
  padding:7px 10px;background:linear-gradient(0deg,rgba(9,8,20,.97) 0%,rgba(9,8,20,.82) 70%,rgba(9,8,20,0) 100%)}
.sidebtns{display:flex;flex-direction:column;gap:4px;width:116px;justify-content:center}
.btn{height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;
  font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.14em}
.btn--surrender{color:#ffd0d9;background:linear-gradient(180deg,#4a1c2a,#2a1018);border:1px solid #8a4a5c}
.btn--chat{color:#cfe9ff;background:linear-gradient(180deg,#1b2740,#111827);border:1px solid #3a5a7a}

.detail{flex:1;min-width:0;display:flex;align-items:center;gap:16px;padding:11px 18px;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--gold-soft);border-radius:6px}
.detail__icon{width:54px;height:54px;flex:none;border:1px solid var(--gold);border-radius:3px;overflow:hidden;background:#14112a}
.detail__body{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.detail__head{display:flex;align-items:center;gap:12px}
.detail__name{font-family:'Cinzel',serif;font-weight:900;font-size:14px;letter-spacing:.12em;color:var(--gold-text)}
.cost{display:flex;align-items:center;gap:4px}
.cost__pip{width:12px;height:12px;border:1px solid #0a0912}
.cost__pip--empty{background:#1a1730;border-color:#4a3f72}
.detail__sep{width:1px;height:12px;background:#3a3158}
.detail__cd{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink-dim)}
.detail__text{font-size:13px;font-weight:600;line-height:1.3;color:var(--ink);text-wrap:pretty}
.detail__classes{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--ink-mute)}

.endturn{flex:none;width:158px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,#6a4a12,#3a2708);border:1px solid var(--gold);border-radius:6px;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,217,122,.25)}
.endturn__l1{font-family:'Cinzel',serif;font-weight:900;font-size:16px;letter-spacing:.12em;color:var(--gold-text)}
.endturn__l2{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--gold-text)}
.endturn__hint{font-size:11px;font-weight:700;letter-spacing:.14em;color:#c9b489}
</style>
</head>
<body>
<div id="viewport">
<div class="stage" id="stage">
  <div class="stage__bg"></div>
  <div class="stage__scrim"></div>

  <!-- ===================== TOPO ===================== -->
  <header class="topbar">
    <div class="player">
      <div class="player__avatar"><div class="slot" data-slot="player1-avatar"></div></div>
      <div class="player__meta">
        <div class="player__name">IAN_D</div>
        <div class="player__rank">ORÁCULO · NÍVEL 12</div>
      </div>
    </div>

    <div class="turnbox">
      <div class="timer">
        <div class="timer__fill" style="width:62%"></div>
        <div class="timer__label">TURNO 7 · 0:38</div>
      </div>
      <div class="energy">
        <div class="energy__pill"><span class="energy__dot" style="background:var(--e-solar)"></span><span class="energy__n">2</span></div>
        <div class="energy__pill"><span class="energy__dot" style="background:var(--e-lunar)"></span><span class="energy__n">1</span></div>
        <div class="energy__pill"><span class="energy__dot" style="background:var(--e-vital)"></span><span class="energy__n">3</span></div>
        <div class="energy__pill"><span class="energy__dot" style="background:var(--e-caos)"></span><span class="energy__n">0</span></div>
        <div class="energy__pill"><span class="energy__dot" style="background:var(--e-vazio)"></span><span class="energy__n">2</span></div>
        <div class="energy__pill"><span class="energy__dot" style="background:var(--e-tempestade)"></span><span class="energy__n">1</span></div>
        <div class="energy__pill"><span style="font-family:'Cinzel',serif;font-weight:900;font-size:11px;color:#e9dfff">Σ</span><span class="energy__n">9</span></div>
      </div>
    </div>

    <div class="player player--enemy">
      <div class="player__meta">
        <div class="player__name">KRATOS_77</div>
        <div class="player__rank">NÍVEL 14 · ASCENDIDO</div>
      </div>
      <div class="player__avatar"><div class="slot" data-slot="player2-avatar"></div></div>
    </div>
  </header>

  <!-- ===================== TIME ALIADO ===================== -->
  <section class="team team--ally">

    <article class="unit" data-unit="ally-1">
      <div class="unit__portrait">
        <div class="portrait"><div class="slot" data-slot="ally-1"></div><div class="portrait__x"></div></div>
        <div class="hp"><div class="hp__fill" style="width:82%"></div><div class="hp__label">82/100</div></div>
      </div>
      <div class="unit__side">
        <div class="effects">
          <div class="effect effect--buff"><div class="slot"></div><div class="effect__turns">3</div></div>
          <div class="effect"><div class="slot"></div><div class="effect__turns">1</div></div>
        </div>
        <div class="skills">
          <button class="skill" data-skill="ally-1-1"><div class="slot"></div><div class="skill__cd"></div></button>
          <button class="skill" data-skill="ally-1-2"><div class="slot"></div><div class="skill__cd"></div></button>
          <button class="skill is-cooldown" data-skill="ally-1-3"><div class="slot"></div><div class="skill__cd">2</div></button>
          <button class="skill" data-skill="ally-1-4"><div class="slot"></div><div class="skill__cd"></div></button>
        </div>
      </div>
    </article>

    <article class="unit" data-unit="ally-2">
      <div class="unit__portrait">
        <div class="portrait"><div class="slot" data-slot="ally-2"></div><div class="portrait__x"></div></div>
        <div class="hp hp--warn"><div class="hp__fill" style="width:54%"></div><div class="hp__label">54/100</div></div>
      </div>
      <div class="unit__side">
        <div class="effects">
          <div class="effect effect--debuff"><div class="slot"></div><div class="effect__turns">2</div></div>
        </div>
        <div class="skills">
          <button class="skill" data-skill="ally-2-1"><div class="slot"></div><div class="skill__cd"></div></button>
          <button class="skill" data-skill="ally-2-2"><div class="slot"></div><div class="skill__cd"></div></button>
          <button class="skill" data-skill="ally-2-3"><div class="slot"></div><div class="skill__cd"></div></button>
          <button class="skill" data-skill="ally-2-4"><div class="slot"></div><div class="skill__cd"></div></button>
        </div>
      </div>
    </article>

    <article class="unit" data-unit="ally-3">
      <div class="unit__portrait">
        <div class="portrait is-down"><div class="slot" data-slot="ally-3"></div><div class="portrait__x"></div></div>
        <div class="hp hp--empty"><div class="hp__label">0/100</div></div>
      </div>
      <div class="skills skills--empty"></div>
    </article>
  </section>

  <!-- ===================== TIME INIMIGO ===================== -->
  <section class="team team--enemy">

    <article class="unit--enemy" data-unit="enemy-1">
      <div class="effects">
        <div class="effect effect--debuff"><div class="slot"></div></div>
        <div class="effect" style="border-color:var(--e-vazio)"><div class="slot"></div></div>
      </div>
      <div class="unit__portrait">
        <div class="portrait"><div class="slot" data-slot="enemy-1"></div><div class="portrait__x"></div></div>
        <div class="hp"><div class="hp__fill" style="width:90%"></div><div class="hp__label">90/100</div></div>
      </div>
    </article>

    <article class="unit--enemy" data-unit="enemy-2">
      <div class="effects"></div>
      <div class="unit__portrait">
        <div class="portrait"><div class="slot" data-slot="enemy-2"></div><div class="portrait__x"></div></div>
        <div class="hp hp--warn"><div class="hp__fill" style="width:37%"></div><div class="hp__label">37/100</div></div>
      </div>
    </article>

    <article class="unit--enemy" data-unit="enemy-3">
      <div class="effects">
        <div class="effect" style="border-color:var(--e-tempestade)"><div class="slot"></div></div>
      </div>
      <div class="unit__portrait">
        <div class="portrait"><div class="slot" data-slot="enemy-3"></div><div class="portrait__x"></div></div>
        <div class="hp"><div class="hp__fill" style="width:100%"></div><div class="hp__label">100/100</div></div>
      </div>
    </article>
  </section>

  <!-- ===================== RODAPÉ ===================== -->
  <footer class="footer">
    <div class="sidebtns">
      <button class="btn btn--surrender">RENDER-SE</button>
      <button class="btn btn--chat">CHAT</button>
    </div>

    <div class="detail" id="skill-detail">
      <div class="detail__icon"><div class="slot" data-slot="skill-detail"></div></div>
      <div class="detail__body">
        <div class="detail__head">
          <div class="detail__name">LANÇA DO CREPÚSCULO</div>
          <div class="cost">
            <span class="cost__pip" style="background:var(--e-solar)"></span>
            <span class="cost__pip" style="background:var(--e-vazio)"></span>
            <span class="cost__pip cost__pip--empty"></span>
          </div>
          <div class="detail__sep"></div>
          <div class="detail__cd">RECARGA 2</div>
        </div>
        <div class="detail__text">Perfura um inimigo causando 30 de dano e removendo 1 energia aleatória do oponente.</div>
        <div class="detail__classes">CORPO A CORPO · FÍSICO · INSTANTÂNEO</div>
      </div>
    </div>

    <button class="endturn">
      <span class="endturn__l1">ENCERRAR</span>
      <span class="endturn__l2">TURNO</span>
      <span class="endturn__hint">2 AÇÕES PRONTAS</span>
    </button>
  </footer>
</div>
</div>

<script>
// escala o canvas fixo 926x428 para preencher a tela do celular
(function () {
  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(innerWidth / 926, innerHeight / 428);
    stage.style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
  fit();
})();
</script>
</body>
</html>
